<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>要件漂移图谱 · Doctrine Drift Atlas</title>
<meta name="description" content="English-common-law element tests, per-jurisdiction overlays, case-law drift timelines, and a 745-post Hong Kong land law corpus — served over a live API.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#FAF9F7; --surface:#FFFFFF; --surface2:#F4F2ED; --ink:#1D1B18; --ink2:#5D584F; --ink3:#8A847A;
  --line:#E5E1D8; --line2:#EFECE5; --accent:#8C2F39; --accent-soft:#F4E7E8;
  --warn:#B4530A; --warn-soft:#FBEDE1; --ok:#1F7A4D; --ok-soft:#E3F1E9;
  --good:#2E7D4F; --good-bg:#E9F2EC; --note:#8A6100; --note-bg:#F6EEDC;
  --stub:#8A847A; --stub-bg:#F0EEE9;
  --jEN:#4568B8; --jHK:#C4703C; --jSG:#1F9472; --jAU:#8461B8;
  --shadow:0 1px 2px rgba(29,27,24,.05),0 4px 16px rgba(29,27,24,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#161513; --surface:#1F1D1A; --surface2:#26241F; --ink:#ECE8E0; --ink2:#A69F92; --ink3:#7A7468;
  --line:#343029; --line2:#2A2722; --accent:#C9737C; --accent-soft:#3A2426;
  --warn:#E08A45; --warn-soft:#2E2318; --ok:#5BB98A; --ok-soft:#16271F;
  --good:#5CB985; --good-bg:#24312A; --note:#D9A94A; --note-bg:#38301F;
  --stub:#7A7468; --stub-bg:#26241F;
  --jEN:#5B82E0; --jHK:#C8792F; --jSG:#27A176; --jAU:#9B6FD9;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  --bg:#161513; --surface:#1F1D1A; --surface2:#26241F; --ink:#ECE8E0; --ink2:#A69F92; --ink3:#7A7468;
  --line:#343029; --line2:#2A2722; --accent:#C9737C; --accent-soft:#3A2426;
  --warn:#E08A45; --warn-soft:#2E2318; --ok:#5BB98A; --ok-soft:#16271F;
  --good:#5CB985; --good-bg:#24312A; --note:#D9A94A; --note-bg:#38301F;
  --stub:#7A7468; --stub-bg:#26241F;
  --jEN:#5B82E0; --jHK:#C8792F; --jSG:#27A176; --jAU:#9B6FD9;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font:15px/1.6 "IBM Plex Sans","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;}
a{color:var(--accent)}
button{font:inherit;cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}

/* shell */
.topbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;padding:9px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:9px;margin-right:4px}
.brand b{font:600 17px/1 Spectral,"Songti SC",serif}
.brand span{font:500 10px/1 "IBM Plex Mono",monospace;letter-spacing:.12em;color:var(--accent);text-transform:uppercase}
.gsearch{flex:1;min-width:180px;max-width:520px;position:relative}
.gsearch input{width:100%;padding:7px 11px 7px 30px;border:1px solid var(--line);border-radius:7px;
  background:var(--bg);color:var(--ink);font:inherit;font-size:13.5px}
.gsearch .ic{position:absolute;left:10px;top:8px;color:var(--ink3);font-size:13px}
.modes{display:flex;gap:2px;flex-wrap:wrap}
.modes button{background:none;border:0;border-bottom:2px solid transparent;color:var(--ink2);
  padding:6px 10px;font-size:13.5px;border-radius:0}
.modes button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.modes button:hover{color:var(--ink)}
.apihint{margin-left:auto;font:400 11px/1 "IBM Plex Mono",monospace;color:var(--ink3)}
.apihint b{color:var(--ink3);font-weight:500}
.apihint b[data-state="online"]{color:var(--good)}
.apihint b[data-state="offline"],.apihint b[data-state="error"]{color:var(--warn)}
.apihint button{margin-left:8px}

.wrap{max-width:1020px;margin:0 auto;padding:20px 16px 90px}
#context{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:2px 0 16px}
select.pick{padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink);font:inherit;font-size:13.5px;max-width:min(440px,100%)}
.statline{font:400 11.5px/1.6 "IBM Plex Mono",monospace;color:var(--ink3)}
.slicrow{display:flex;gap:6px;flex-wrap:wrap}


h1.page{font:600 30px/1.15 Spectral,"Songti SC",serif;margin:0 0 6px;text-wrap:balance}
.crumb{font:500 10.5px/1 "IBM Plex Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin:0 0 6px}
.lede{color:var(--ink2);max-width:70ch;margin:0 0 20px}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:9px;margin:0 0 22px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:11px 13px;box-shadow:var(--shadow)}
.tile .n{font:600 24px/1.1 "IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.tile .l{font-size:11.5px;color:var(--ink3);margin-top:2px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:0 0 10px;box-shadow:var(--shadow)}
.card h4{margin:0 0 4px;font-size:14.5px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);
  border-radius:999px;padding:4px 10px;font-size:12px;color:var(--ink2)}
.chip[aria-pressed="true"]{border-color:currentColor;color:var(--ink)}
.chip[aria-pressed="false"]{opacity:.42}
.chip .dot{width:8px;height:8px;border-radius:50%}
.chip.sm{padding:3px 8px;font-size:11.5px}
.badge{font:500 9.5px/1 "IBM Plex Mono",monospace;letter-spacing:.05em;border-radius:4px;padding:3px 6px;white-space:nowrap}
.badge.v{color:var(--good);background:var(--good-bg)}
.badge.n{color:var(--note);background:var(--note-bg)}
.badge.j{color:var(--ink2);background:var(--line2)}
.badge.drift{color:var(--accent);background:var(--accent-soft)}
.jtag{display:inline-flex;align-items:center;gap:5px;font:500 11px/1 "IBM Plex Mono",monospace;color:var(--ink2);white-space:nowrap}
.jtag i{width:8px;height:8px;border-radius:50%}
.cnt{font:400 11px/1 "IBM Plex Mono",monospace;color:var(--ink3);white-space:nowrap}
.tile.clickable{cursor:pointer}
.tile.clickable{text-align:left;color:var(--ink)}
.rgroup{margin:0 0 12px}
.rlab{font:600 13.5px/1.6 "IBM Plex Sans",sans-serif;margin-right:8px}
.rgroup .jbar{display:flex;align-items:stretch;gap:7px;flex-wrap:wrap;margin-top:5px}
.jchip{display:flex;flex-direction:column;align-items:flex-start;gap:5px;max-width:100%;padding:7px 9px;
  color:var(--ink2);background:var(--surface);border:1px solid var(--line);border-radius:8px;text-align:left}
.jchip:hover,.jchip.on{color:var(--ink);border-color:var(--accent);background:var(--accent-soft)}
.jchip .module-name{font-weight:600}
.meta-tags{display:inline-flex;align-items:center;gap:4px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:2px 6px;
  font:500 9.5px/1.25 "IBM Plex Mono",ui-monospace,monospace;white-space:nowrap;color:var(--ink2);background:var(--surface2)}
.tag.logic{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,var(--line));background:var(--accent-soft)}
.tag.source{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,var(--line));background:var(--ok-soft)}
.tag.model{color:var(--note);border-color:color-mix(in srgb,var(--note) 45%,var(--line));background:var(--note-bg)}
.tag.posture-spear{color:color-mix(in srgb,var(--accent) 78%,var(--ink));border-color:color-mix(in srgb,var(--accent) 55%,var(--line));background:var(--accent-soft)}
.tag.posture-shield{color:var(--note);border-color:color-mix(in srgb,var(--warn) 55%,var(--line));background:var(--note-bg)}
.tag.track{color:var(--ink2);border-color:var(--line);background:var(--surface2)}
.position-panel{border-left:3px solid var(--accent);padding:10px 13px;margin:8px 0 16px}
.position-panel .position-title{font:600 12.5px/1.4 "IBM Plex Sans",sans-serif;margin:0 0 7px}
.position-panel .position-note{font-size:12px;line-height:1.55;color:var(--ink2);margin:7px 0 0;max-width:82ch}
.position-overview{margin:0 0 18px}
.position-overview .position-overview-title{font:600 17px/1.4 Spectral,"Songti SC",serif;margin:0 0 4px}
.position-overview .axis{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:7px}
.position-overview .axis-label{min-width:86px;font:500 10.5px/1 "IBM Plex Mono",monospace;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em}
.logic-line{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:4px 0 12px}
.tile.clickable:hover{border-color:var(--accent)}
.tiles .tile .sub{font-size:11px;color:var(--ink3);margin-top:2px}
details.au{margin-top:9px}
details.au summary{cursor:pointer;font-size:12.5px;color:var(--ink2)}
details.au summary:hover{color:var(--accent)}
details.au summary b{color:var(--ink);font-weight:600}

/* doctrine */
.sid{font:500 11px/1 "IBM Plex Mono",monospace;color:var(--accent)}
.test{color:var(--ink2);font-size:13.5px;margin:7px 0 9px;max-width:78ch}
.auth{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:12.5px;margin-bottom:3px}
.auth .cite{font:400 11.5px/1.5 "IBM Plex Mono",monospace;color:var(--ink2)}
.jgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0 0 22px;align-items:start}
@media(max-width:620px){
  .jgrid{grid-template-columns:1fr}
  .topbar{position:static;gap:7px;padding:8px 12px}
  .brand{width:100%}
  .gsearch{flex:1 0 100%;max-width:none}
  .modes{flex:1 0 100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:thin;padding-bottom:2px}
  .modes button{flex:0 0 auto;padding:5px 8px}
  .apihint{width:100%;margin-left:0;text-align:right;font-size:10px}
}
.jcard{background:var(--surface);border:1px solid var(--line);border-left-width:3px;border-radius:9px;padding:12px 14px;box-shadow:var(--shadow)}
.jcard .jt{display:flex;align-items:center;gap:7px;font:600 13px/1 "IBM Plex Sans",sans-serif;margin-bottom:6px}
.jcard p{margin:0 0 5px;font-size:12.5px;color:var(--ink2)}
.jcard .rule{font-size:11.5px;color:var(--ink3)}
.jcard>summary{cursor:pointer;font-size:13px;line-height:1.6;font-weight:600}
.jcard>summary::marker{color:var(--accent)}
.jcard[open]>summary{margin-bottom:12px}
.evidence{flex-basis:100%;font-size:12px;line-height:1.55;color:var(--ink2);overflow-wrap:anywhere}
.evidence .missing{color:var(--warn)}
.kv{font-size:12px;color:var(--ink2);margin:3px 0}
.kv b{font:500 11px/1 "IBM Plex Mono",monospace;color:var(--ink)}

figure.tl{margin:12px 0 4px;padding:0}
.tlhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:5px}
.tlhead .t{font:600 13.5px/1.4 "IBM Plex Sans",sans-serif}
.tlhead .axisnote{font-size:11px;color:var(--ink3)}
.chartwrap{position:relative;overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.chartwrap svg{display:block;min-width:620px;width:100%;height:auto}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:6px;padding:8px 10px;
  font-size:12px;line-height:1.5;max-width:290px;opacity:0;z-index:5}
.tip.show{opacity:1}
.tip .tt{font:500 10px/1 "IBM Plex Mono",monospace;letter-spacing:.06em;text-transform:uppercase;opacity:.75}
.asof{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:10px 0 8px}
.asof label{font:500 10.5px/1 "IBM Plex Mono",monospace;letter-spacing:.08em;color:var(--ink3);text-transform:uppercase}
.asof input[type=range]{flex:1;min-width:150px;accent-color:var(--accent)}
.asof .yr{font:500 14px/1 "IBM Plex Mono",monospace;color:var(--accent);min-width:44px;font-variant-numeric:tabular-nums}
.standing{display:grid;grid-template-columns:repeat(auto-fit,minmax(228px,1fr));gap:8px;margin-bottom:6px}
.stand{border:1px solid var(--line);border-left-width:3px;border-radius:6px;background:var(--surface);padding:8px 11px;font-size:12px;color:var(--ink2)}
.stand .jt{display:flex;gap:6px;align-items:center;font:600 11.5px/1 "IBM Plex Sans",sans-serif;color:var(--ink);margin-bottom:4px}
.stand .cs{font:400 10.5px/1.4 "IBM Plex Mono",monospace;color:var(--ink3)}
.fig-foot{font-size:11.5px;color:var(--ink3);margin:6px 0 0;max-width:78ch}

/* corpus */
.searchrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.searchrow input,.searchrow select{padding:6px 10px;border:1px solid var(--line);border-radius:7px;
  background:var(--surface);color:var(--ink);font:inherit;font-size:13px}
.searchrow input[type=search]{flex:1;min-width:200px}
.facets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 9px;font-size:11.5px;color:var(--ink2)}
.fchip b{color:var(--ink);font-weight:500}
.fchip[data-on="1"]{border-color:var(--accent);color:var(--accent)}
.post{border-bottom:1px solid var(--line2);padding:11px 0}
.post h4{margin:0 0 3px;font-size:14.5px;line-height:1.4}
.post h4 a{color:var(--ink);text-decoration:none}
.post h4 a:hover{color:var(--accent);text-decoration:underline}
.post .meta{font:400 11px/1.5 "IBM Plex Mono",monospace;color:var(--ink3);display:flex;gap:9px;flex-wrap:wrap}
.post .sum{font-size:13px;color:var(--ink2);margin:5px 0 5px;max-width:82ch}
.post .cs{font-size:11.5px;color:var(--ink3)}
.moref{flex-basis:100%}
.moref summary{cursor:pointer;font-size:11.5px;color:var(--ink3);list-style:none}
.moref summary:hover{color:var(--accent)}
.moref summary::before{content:"+ "}
.moref[open] summary::before{content:"\2013 "}
.vbtn{background:none;border:1px solid var(--line);border-radius:4px;color:var(--ink3);font-size:10px;line-height:1.5;padding:0 5px;margin-left:5px;vertical-align:1px}
.vbtn:hover{color:var(--accent);border-color:var(--accent)}
.morec{display:inline}
.morec summary{display:inline;cursor:pointer;font-size:11px;color:var(--ink3)}
.morec summary:hover{color:var(--accent)}
.morec>div{margin:4px 0 2px}
.post .cs b{color:var(--ink2);font-weight:500}
table.data{width:100%;border-collapse:collapse;font-size:13px}
table.data th{text-align:left;font:500 10.5px/1 "IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink3);border-bottom:1px solid var(--line);padding:7px 8px}
table.data td{border-bottom:1px solid var(--line2);padding:7px 8px;vertical-align:top}
table.data tr:hover td{background:var(--surface2)}
table.data td.num{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;text-align:right;color:var(--ink2)}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:9px;background:var(--surface);box-shadow:var(--shadow)}
.linkbtn{background:none;border:0;color:var(--accent);padding:0;font:inherit;text-align:left;text-decoration:underline;text-underline-offset:2px}
.bars{display:flex;flex-direction:column;gap:4px}
.bar{display:grid;grid-template-columns:190px 1fr 48px;gap:9px;align-items:center;font-size:12.5px}
.bar .t{color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .track{background:var(--line2);border-radius:3px;height:9px;overflow:hidden}
.bar .fill{height:100%;border-radius:3px;background:var(--accent)}
.bar .n{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;text-align:right;color:var(--ink3);font-size:11.5px}
pre.code{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:11px 13px;overflow-x:auto;
  font:400 12px/1.6 "IBM Plex Mono",monospace;color:var(--ink2);margin:6px 0}
pre.code b{color:var(--accent);font-weight:500}
.ep{display:grid;grid-template-columns:minmax(220px,300px) 1fr auto;gap:10px;align-items:baseline;
  border-bottom:1px solid var(--line2);padding:8px 0;font-size:12.5px}
.ep code{font:500 12px/1.5 "IBM Plex Mono",monospace;color:var(--accent)}
.ep .d{color:var(--ink2)}
.loading{color:var(--ink3);font-size:13px;padding:20px 0}
footer.site{margin-top:40px;border-top:1px solid var(--line);padding-top:14px;color:var(--ink3);font-size:11.5px;max-width:90ch}
@media (max-width:900px){
  .bar{grid-template-columns:120px 1fr 44px}
}
.mini{height:6px;background:var(--line2);border-radius:3px;overflow:hidden;min-width:54px;display:inline-block;vertical-align:middle;width:70px}
.mini>div{height:100%;border-radius:3px}
.tiny{font:400 11px/1 "JetBrains Mono",ui-monospace,monospace;color:var(--ink3);margin-left:6px}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin:12px 0}
.tblwrap table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:560px}
.tblwrap th,.tblwrap td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line2);white-space:nowrap}
.tblwrap th{font:600 10.5px/1.3 "JetBrains Mono",ui-monospace,monospace;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3)}
.tblwrap tr:last-child td{border-bottom:0}
.tblwrap td.n{text-align:right;font-variant-numeric:tabular-nums;font-family:"JetBrains Mono",ui-monospace,monospace}
.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 7px;font:600 10.5px/1.5 "JetBrains Mono",ui-monospace,monospace}
.probe{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:9px}
.probe input{flex:1 1 150px;min-width:110px;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font:inherit;font-size:13px}
.btn{padding:7px 14px;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:7px;font:600 13px/1 inherit;cursor:pointer}
.out{background:var(--surface2,var(--bg));border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto;font:400 11.5px/1.55 "JetBrains Mono",ui-monospace,monospace;color:var(--ink2);max-height:340px}
.tri{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.tri button{border:0;background:var(--surface);color:var(--ink3);font:600 11px/1 inherit;padding:6px 9px;cursor:pointer;border-right:1px solid var(--line)}
.tri button:last-child{border-right:0}
.tri button.on{background:var(--accent);color:#fff}
ol.ev{margin:4px 0 0;padding-left:20px;font-size:13px;color:var(--ink2)}
ol.ev li{margin-bottom:4px}
nav.subs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 18px;padding-bottom:0}
nav.subs button{border:0;border-bottom:2px solid transparent;background:none;color:var(--ink3);font:600 13.5px/1 inherit;padding:8px 12px;cursor:pointer}
nav.subs button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--accent)}
details.card>summary{cursor:pointer;list-style:none;font-weight:600;font-size:14.5px}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::before{content:'▸ ';color:var(--accent)}
details.card[open]>summary::before{content:'▾ '}
.tierleg{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tierchip{display:inline-block;border:1px solid var(--line);border-radius:5px;padding:2px 7px;font:500 10.5px/1.6 "JetBrains Mono",ui-monospace,monospace;color:var(--ink2)}
.tierchip[data-t="heavy"]{border-color:var(--accent);color:var(--accent)}
.tierchip[data-t="substantial"]{opacity:.92}
.tierchip[data-t="light"],.tierchip[data-t="marginal"]{opacity:.6}

<body>

<div class="topbar">
  <div class="brand"><b>要件漂移图谱</b><span>Doctrine Drift Atlas</span></div>
  <div class="gsearch"><span class="ic mono">⌕</span><input id="gq" type="search" placeholder="搜索语料 · 判例 · 学说标签" autocomplete="off"></div>
  <nav class="modes" id="modes"></nav>
  <div class="apihint mono">API <b id="apistat" data-state="connecting" role="status" aria-live="polite">正在连接…</b><button id="connectionRetry" class="chip sm" type="button" hidden>检查连接</button></div>
</div>

<div class="wrap">
  <div id="context" aria-label="context navigation"></div>
  <main id="main"><div class="loading" role="status" aria-live="polite">正在加载…</div></main>
  <footer class="site">
    要件数据集 v0.4（英/港/新/澳）。核验等级以每条来源记录为准；名称或引证匹配不证明法律命题。favor 轴为编者标定。语料为 hklandlaw.wordpress.com 745 篇公开文章的<strong>元数据与自动生成的简短摘要</strong>（标题、日期、判例名与引证、学说标签），每条均回链原文，不复制原文内容；版权归原作者所有。本页为研究工具，不构成法律意见。
  </footer>
</div>

<script type="module">
import {createScoreUpdater} from './scoring-results.js';
import {createApiClient,createBootstrap} from './connection.js';
const API = '/api';
const $ = (s, r=document) => r.querySelector(s);
const el = (t, c, h) => { const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e; };
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const jColor = j => getComputedStyle(document.documentElement).getPropertyValue('--j'+j).trim() || 'var(--ink2)';
const fmt = n => n==null?'—':n.toLocaleString('en-US');
function appendEvidence(target,record){
  const box=el('div','evidence');
  const level=String(record.verified||'unverified');
  if(record.pin) box.appendChild(el('div',null,'引注位置：'+esc(record.pin)));
  else if(['primary','quoted','verified-primary','verified-quoted'].includes(level)) box.appendChild(el('div','missing','该记录尚缺引注位置，请核对原文。'));
  const source=record.source ?? record.src;
  if(source){
    const text=typeof source==='string'?source:JSON.stringify(source);
    const row=el('div'); row.appendChild(document.createTextNode('来源记录：'));
    let url;
    if(typeof source==='string' && !/\s/.test(source)){
      try {const parsed=new URL(/^https?:\/\//i.test(source)?source:'https://'+source);
        if(['http:','https:'].includes(parsed.protocol) && parsed.hostname.includes('.')) url=parsed.href;
      } catch {}
    }
    if(url){const link=el('a');link.textContent=text;link.href=url;link.target='_blank';link.rel='noopener noreferrer';row.appendChild(link);}
    else row.appendChild(document.createTextNode(text));
    box.appendChild(row);
  } else if(['quoted','verified-quoted'].includes(level)) box.appendChild(el('div','missing','该转引记录尚缺引用来源，请核对。'));
  if(box.childNodes.length) target.appendChild(box);
}
function offerRetry(container,message,retry){
  container.replaceChildren(el('p','test',esc(message)));
  const button=el('button','chip sm','重试');
  button.type='button';button.onclick=retry;container.appendChild(button);
}
function connectionStatus(status){
  const indicator=$('#apistat'), retry=$('#connectionRetry');
  indicator.dataset.state=status.state;
  const labels={connecting:'正在连接…',online:'最近请求成功',offline:'连接已中断',error:'服务响应异常'};
  indicator.textContent=labels[status.state]||'尚未连接';
  retry.hidden=!['offline','error'].includes(status.state);
}
const request=createApiClient({base:API,onStatus:connectionStatus});
async function api(p,options){
  const r=await request(p,options);
  if(!r.ok){
    const detail=Array.isArray(r.data?.errors)?r.data.errors.join('；'):r.data?.error;
    throw new Error(typeof detail==='string'?detail:'数据服务暂时无法完成请求（'+r.status+'），请重试。');
  }
  return r.data;
}

const state = { mode:'doctrine', claim:'misrepresentation', q:'', filters:{}, tax:null, elements:null, stats:null };
let SCFILTER = {posture:null,track:null};
let SCCHOOSEROPEN = false;

/* ── shell ───────────────────────────────────────────── */
const MODES = [
  ['doctrine','要件 Doctrine'], ['scored','判断逻辑 Logic'], ['corpus','语料 Corpus'],
  ['maint','维护 Maintenance'], ['api','API / MCP'],
];
const SUBS = [['corpus','文章'],['cases','判例'],['topics','标签'],['graph','图谱']];
function renderModes(){
  const n = $('#modes'); n.innerHTML='';
  for(const [k,label] of MODES){
    const b = el('button',null,label);
    b.setAttribute('aria-current', String(state.mode===k));
    b.onclick = () => {
      state.mode=k;
      if(k==='scored') SCFILTER={posture:null,track:null};
      if(state.tax && state.elements && state.stats) route({focusTarget:'heading'}); else init();
    };
    n.appendChild(b);
  }
}

/* ── context bar (single-column shell: claim select / slice chips / stats) ── */
const SLICES = [['','全部 745 篇'],['proprietary-estoppel','proprietary estoppel'],['adverse-possession','adverse possession'],
  ['common-intention-constructive-trust','CI constructive trust'],['easements','easements'],['deed-of-mutual-covenant','DMC'],
  ['land-registration','land registration'],['formalities','formalities']];
const LITIGATION_POSTURES = {
  spear:{label:'矛 Spear',description:'主动提出请求、反请求或申请'},
  shield:{label:'盾 Shield',description:'回应、限制或阻却对方请求'},
};
const LITIGATION_TRACKS = {
  merits:{label:'实体 Merits',description:'权利、责任、抗辩、定性与救济'},
  procedure:{label:'程序 Procedure',description:'诉讼、仲裁、承认或执行步骤'},
  jurisdiction:{label:'管辖 Jurisdiction',description:'法院能否及应否审理'},
};
const LITIGATION_TRACK_ORDER = ['merits','procedure','jurisdiction'];
const claimLogicStatus = claim => claim?.logic_status
  || (claim?.status==='logic-full'?'full':claim?.status==='logic-partial'?'partial':null);
function claimStatusLabel(claim){
  if(claim?.status==='full') return '完整要件';
  const logicStatus=claimLogicStatus(claim);
  if(logicStatus==='full') return '测试已建';
  if(logicStatus==='partial') return '部分测试';
  if(claim?.status==='xref') return '交叉引用';
  if(claim?.status==='corpus-only') return '语料覆盖';
  if(claim?.status==='planned') return '规划中';
  return '状态待核';
}
function litigationTags(item){
  let html = '';
  for(const posture of item?.litigation_postures||[]){
    const meta=LITIGATION_POSTURES[posture];
    html += '<span class="tag posture-'+esc(posture)+'">诉讼姿态 · '+esc(meta?.label||posture)+'</span>';
  }
  const track=LITIGATION_TRACKS[item?.litigation_track];
  if(track) html += '<span class="tag track">事项轨道 · '+esc(track.label)+'</span>';
  if(item?.court_own_motion) html += '<span class="tag track">法院可依职权 Court own motion</span>';
  else if(item?.court_own_motion_summary?.stage_count){
    html += '<span class="tag track">含依职权阶段 · '+esc((item.court_own_motion_summary.stage_ids||[]).join(' / '))+'</span>';
  }
  return html;
}
function appendLitigationPosition(main,item,tax=state.tax){
  if(!item?.litigation_postures?.length && !item?.litigation_track) return;
  const box=el('section','card position-panel');
  const title=el('h2','position-title','诉讼位置 Litigation position');
  title.id='litigation-position-title';
  box.setAttribute('aria-labelledby',title.id);
  box.appendChild(title);
  box.appendChild(el('div','meta-tags',litigationTags(item)));
  box.appendChild(el('p','position-note',esc(item.litigation_note||item.role_note||tax?.litigation_position_note||'')));
  main.appendChild(box);
}
function appendPositionOverview(main,tax=state.tax){
  const modules=tax?.legal_test_modules||[];
  if(!modules.length) return;
  const box=el('section','position-overview');
  const title=el('h2','position-overview-title','诉讼位置 Litigation position');
  title.id='litigation-position-overview-title';
  box.setAttribute('aria-labelledby',title.id);
  box.appendChild(title);
  box.appendChild(el('p','test',esc(tax.litigation_position_note||'')));
  const addAxis=(label,catalog,field)=>{
    const row=el('div','axis'); row.appendChild(el('span','axis-label',label));
    for(const [id,meta] of Object.entries(catalog)){
      const matching=modules.filter(module=>field==='litigation_postures'
        ? (module[field]||[]).includes(id) : module[field]===id);
      if(!matching.length) continue;
      const button=el('button','chip sm',esc(meta.label)+' · '+matching.length);
      button.type='button';
      button.title=meta.description;
      const filterKind=field==='litigation_postures'?'posture':'track';
      button.setAttribute('aria-label','按'+label+'筛选判断逻辑：'+meta.label+'，'+matching.length+' 个模块');
      button.onclick=()=>{
        SCFILTER={posture:null,track:null,[filterKind]:id};
        const first=matching.slice().sort((a,b)=>LITIGATION_TRACK_ORDER.indexOf(a.litigation_track)-LITIGATION_TRACK_ORDER.indexOf(b.litigation_track))[0];
        SCMOD=first.id;
        state.mode='scored';
        route({focusTarget:'heading'});
        window.scrollTo(0,0);
      };
      row.appendChild(button);
    }
    box.appendChild(row);
  };
  addAxis('诉讼姿态',LITIGATION_POSTURES,'litigation_postures');
  addAxis('事项轨道',LITIGATION_TRACKS,'litigation_track');
  main.appendChild(box);
}
function renderContext(){
  const c = $('#context'); c.innerHTML='';
  if(state.mode==='doctrine' && state.tax){
    c.appendChild(el('span','cnt','法律事项'));
    const sel = el('select','pick'); sel.setAttribute('aria-label','选择法律事项');
    for(const area of state.tax.areas){
      const g = document.createElement('optgroup'); g.label = area.zh+' '+area.en;
      for(const cl of area.claims){
        const o = document.createElement('option');
        const posture=(cl.litigation_postures||[]).map(id=>LITIGATION_POSTURES[id]?.label.split(' ')[0]||id).join('+');
        const track=cl.litigation_track&&cl.litigation_track!=='merits' ? LITIGATION_TRACKS[cl.litigation_track]?.label.split(' ')[0] : '';
        const position=[posture,track].filter(Boolean).join(' · ');
        o.value = cl.id;
        o.textContent = '【'+claimStatusLabel(cl)+'】'+cl.zh+(position?'〔'+position+'〕':'');
        if(state.claim===cl.id) o.selected = true;
        g.appendChild(o);
      }
      sel.appendChild(g);
    }
    sel.onchange = () => { state.claim = sel.value; route({focusTarget:'claim-select'}); window.scrollTo(0,0); };
    c.appendChild(sel);
  } else if(state.mode==='corpus' && (state.sub||'corpus')==='corpus'){
    const row = el('div','slicrow');
    for(const [q,label] of SLICES){
      const b = el('button','chip sm', esc(label));
      b.setAttribute('aria-pressed', String((state.filters.topic||'')===q));
      b.onclick = () => { state.filters = q?{topic:q}:{}; route(); };
      row.appendChild(b);
    }
    c.appendChild(row);
  } else {
    const s = state.stats||{};
    c.appendChild(el('span','statline',
      fmt(s.posts)+' 篇文章 · '+fmt(s.uniqueCases)+' 判例 · '+fmt(s.topics)+' 标签 · '+fmt(s.statutes)+' 条文 · '+fmt(s.elementSubTests)+' 子测试 · '+fmt(s.timelineEvents)+' 漂移事件'));
  }
}



/* ── timeline chart ──────────────────────────────────── */
const JUR = ['EN','HK','SG','AU'];
const JZH = {EN:'英国',HK:'香港',SG:'新加坡',AU:'澳大利亚'};
const jActive = {EN:true,HK:true,SG:true,AU:true};

async function renderTimeline(container, id){
  const fig = el('figure','tl');
  const wrapEl = el('div','chartwrap');
  const tip = el('div','tip');
  const NS='http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS,'svg');
  svg.setAttribute('role','img');
  wrapEl.appendChild(svg); wrapEl.appendChild(tip);

  const head = el('div','tlhead');
  fig.appendChild(head); fig.appendChild(wrapEl);
  const asofRow = el('div','asof'); const standing = el('div','standing'); const foot = el('p','fig-foot');
  fig.appendChild(asofRow); fig.appendChild(standing); fig.appendChild(foot);
  container.appendChild(fig);

  const base = await api('/timeline/'+id);
  head.innerHTML = '<div class="t">'+esc(base.id)+' · '+esc(base.title)+'</div>'+
    '<div class="axisnote">纵轴:标准倾向 ↑利于主张方 / ↓利于抗辩方(编者标定)</div>';
  foot.textContent = base.note ? '当前编者说明（未按所选年份回溯）：'+base.note : '';

  const evs = base.events.slice().sort((a,b)=>a.y-b.y);
  const minY = Math.min(...evs.map(e=>e.y));
  const lo = Math.floor((minY-4)/10)*10, hi = 2026;
  let asOf = hi;

  const W=780,H=278,padL=20,padR=66,padT=28,padB=34;
  const x = y => padL + (y-lo)/(hi-lo)*(W-padL-padR);
  const yv = f => padT + (1-(f+1)/2)*(H-padT-padB);
  svg.setAttribute('viewBox','0 0 '+W+' '+H);
  svg.setAttribute('aria-label', base.title);

  function draw(){
    svg.innerHTML='';
    const s=(n,a,t)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);if(t!=null)e.textContent=t;svg.appendChild(e);return e;};
    for(let yr=Math.ceil(lo/20)*20; yr<=hi; yr+=20){
      s('line',{x1:x(yr),x2:x(yr),y1:padT,y2:H-padB,stroke:'var(--line2)','stroke-width':1});
      s('text',{x:x(yr),y:H-12,'text-anchor':'middle',fill:'var(--ink3)','font-size':10,'font-family':'IBM Plex Mono,monospace'},String(yr));
    }
    s('line',{x1:padL,x2:W-padR,y1:yv(0),y2:yv(0),stroke:'var(--line)','stroke-width':1,'stroke-dasharray':'3 4'});
    s('text',{x:padL,y:padT-11,fill:'var(--ink3)','font-size':10,'font-family':'IBM Plex Sans,sans-serif'},'利于主张方 pro-claimant');
    s('text',{x:padL,y:H-padB+14,fill:'var(--ink3)','font-size':10,'font-family':'IBM Plex Sans,sans-serif'},'利于抗辩方 pro-defendant');
    if(asOf<hi) s('rect',{x:x(asOf),y:padT,width:Math.max(0,W-padR-x(asOf)),height:H-padT-padB,fill:'var(--line2)',opacity:.55});

    for(const j of JUR){
      if(!jActive[j]) continue;
      const mine = evs.filter(e=>e.j===j);
      if(!mine.length) continue;
      const col = jColor(j);
      const inWin = mine.filter(e=>e.y<=asOf);
      if(inWin.length>1) s('polyline',{points:inWin.map(e=>x(e.y)+','+yv(e.f)).join(' '),fill:'none',stroke:col,'stroke-width':2,'stroke-linejoin':'round','stroke-linecap':'round'});
      for(const e of mine){
        const dim = e.y>asOf;
        s('circle',{cx:x(e.y),cy:yv(e.f),r:5,fill:col,stroke:'var(--surface)','stroke-width':2,opacity:dim?0.25:1});
        const hit = s('circle',{cx:x(e.y),cy:yv(e.f),r:13,fill:'transparent',style:'cursor:pointer'});
        hit.addEventListener('pointerenter',ev=>{
          tip.innerHTML='<div class="tt">'+j+' · '+e.y+' · '+esc(e.treat)+'</div><div><b>'+esc(e.case)+'</b></div><div>'+esc(e.eff)+'</div>';
          tip.classList.add('show');
          const r=wrapEl.getBoundingClientRect();
          tip.style.left=Math.max(6,Math.min(ev.clientX-r.left+12, r.width-300))+'px';
          tip.style.top=(ev.clientY-r.top+12)+'px';
        });
        hit.addEventListener('pointerleave',()=>tip.classList.remove('show'));
      }
      const arr = inWin.length?inWin:mine.slice(0,1);
      const last = arr[arr.length-1];
      s('text',{x:x(last.y)+10,y:yv(last.f)+4,fill:col,'font-size':11,'font-weight':600,'font-family':'IBM Plex Mono,monospace'},j);
    }
  }

  asofRow.innerHTML = '<label>查询截至年份（判例记录）</label>';
  const range = el('input'); range.type='range'; range.min=String(minY); range.max=String(hi); range.value=String(hi);
  range.setAttribute('aria-label','as-of year');
  const out = el('span','yr',String(hi));
  asofRow.appendChild(range); asofRow.appendChild(out);

  let timer=null, standingRequest=0;
  async function refreshStanding(){
    const request=++standingRequest, requestedYear=asOf;
    let data;
    try { data=await api('/timeline/'+id+'?as_of='+requestedYear); }
    catch(error) {
      if(request===standingRequest && requestedYear===asOf && standing.isConnected) offerRetry(standing,'该日期的资料暂时加载失败，可以保持年份重试。',refreshStanding);
      return;
    }
    if(request!==standingRequest || requestedYear!==asOf || !standing.isConnected) return;
    standing.innerHTML='';
    for(const r of data.standing_rules){
      if(!jActive[r.jurisdiction]) continue;
      const d = el('div','stand'); d.style.borderLeftColor = jColor(r.jurisdiction);
      // Show rank and date metadata without inferring an unversioned legal rule.
      const jj = r.jurisdiction;
      const ln = data.latest_is_not_governing && data.latest_is_not_governing[jj];
      const cf = data.subordinate_conflicts && data.subordinate_conflicts[jj];
      d.innerHTML = '<div class="jt"><span style="width:8px;height:8px;border-radius:50%;background:'+jColor(jj)+'"></span>'
        + jj+' '+JZH[jj]+' · '+r.since+(r.court&&!/\)\s*$/.test(r.case)?' · '+esc(r.court):'')+'</div>'+esc(r.historical_rule_status==='historical-rule-not-modelled'?'历史规则正文尚未建立，请核对判决原文。':r.effect)+'<div class="cs">'+esc(r.case)+(r.treatment?' · '+esc(r.treatment):'')+'</div>'
        + (ln ? '<div class="cs" style="margin-top:6px;opacity:.85">最新裁决非最高层级 · latest: '+esc(ln.latest_event.case)+(/\)\s*$/.test(ln.latest_event.case)?' ('+ln.latest_event.year+')':' ('+esc(ln.latest_event.court)+', '+ln.latest_event.year+')')+'<br>'+(data.historical_mode==='strict'?'法院层级与时间顺序不同，具体规则须核对原文。':'上级法院的表述具约束力；最新裁决反映当前如何适用')+'</div>' : '')
        + (cf ? '<div class="cs" style="margin-top:4px;opacity:.85">下级法院此后有相反表述 · '+cf.map(function(c){return esc(c.case)+' ('+c.year+')';}).join('; ')+'<br>上级法院优先，但二者或可调和——先核对是否针对同一问题</div>' : '');
      if(r.recency_status==='recency-unresolved') d.appendChild(el('div','cs','日期精度不足，相关记录并列；无法确认先后。'));
      standing.appendChild(d);
    }
    for(const j of data.jurisdictions_with_no_authority_at_as_of){
      if(!jActive[j]) continue;
      const d = el('div','stand'); d.style.borderLeftColor = jColor(j);
      d.innerHTML = '<div class="jt"><span style="width:8px;height:8px;border-radius:50%;background:'+jColor(j)+'"></span>'+j+' '+JZH[j]+'</div><span class="cs">没有符合该截止日期的本法域记录；这不表示当时不存在相关判例。</span>';
      standing.appendChild(d);
    }
  }
  range.addEventListener('input',()=>{
    asOf=+range.value; out.textContent=String(asOf); draw();
    standing.textContent='正在读取截至 '+asOf+' 年的判例记录…';
    clearTimeout(timer); timer=setTimeout(refreshStanding,140);
  });
  draw(); refreshStanding();
}

/* ── views ───────────────────────────────────────────── */
async function viewDoctrine(main){
  const claim = state.tax.areas.flatMap(a=>a.claims).find(c=>c.id===state.claim);
  const area = state.tax.areas.find(a=>a.claims.some(c=>c.id===state.claim));
  main.innerHTML='';
  main.appendChild(el('p','crumb', esc(area.zh)+' '+esc(area.en)+' / '+esc(claim.en)));
  main.appendChild(el('h1','page', esc(claim.zh)+' <span style="color:var(--ink3);font-size:.6em;font-weight:500">'+esc(claim.en)+'</span>'));
  appendLitigationPosition(main,claim);

  if(claim.status!=='full'){
    const c = el('div','card');
    const logicStatus=claimLogicStatus(claim);
    const b = logicStatus==='full' ? '<span class="badge v">法律测试已建成</span>'
            : logicStatus==='partial' ? '<span class="badge j">已有部分测试</span>'
            : claim.status==='planned' ? '<span class="badge n">规划中</span>'
            : claim.status==='xref' ? '<span class="badge j">交叉引用</span>'
            : '<span class="badge j">语料已覆盖</span>';
    c.innerHTML = b + '<p class="test" style="margin-top:9px">'+esc(claim.note||'')+'</p>'
      + (claim.lab?'<p class="mono" style="font-size:11.5px;color:var(--ink3);margin:0">'+esc(claim.lab)+'</p>':'');
    main.appendChild(c);
    if(claim.corpusTopics){
      const box = el('div','card');
      box.innerHTML = '<h4>语料切片</h4><p class="test">语料中的相关材料可与当前法律测试交叉核对。</p>';
      const row = el('div','chips');
      for(const t of claim.corpusTopics){
        const b2 = el('button','chip sm', esc(t));

async function viewCorpus(main){
  main.innerHTML='';
  main.appendChild(el('h1','page','语料检索 <span style="color:var(--ink3);font-size:.55em;font-weight:500">Corpus search</span>'));
  main.appendChild(el('p','lede','hklandlaw.wordpress.com 全站 745 篇的结构化索引:标题、日期、判例名与引证、学说标签、自动摘要。检索在服务端倒排索引上执行。'));

  const row = el('div','searchrow');
  const inp = el('input'); inp.type='search'; inp.placeholder='关键词(支持前缀匹配,如 estopp / 信托 / Peekay)'; inp.value = state.q;
  const selY = el('select'); const selC = el('select'); const selJ = el('select'); const selT = el('select');
  inp.setAttribute('aria-label','语料关键词');
  [selY,selC,selJ,selT].forEach((select,i)=>select.setAttribute('aria-label',['筛选年份','筛选法院','筛选法域','筛选类型'][i]));
  row.append(inp, selY, selC, selJ, selT);
  main.appendChild(row);
  const facets = el('div','facets'); main.appendChild(facets);
  const results = el('div'); main.appendChild(results);

  function qs(){
    const p = new URLSearchParams();
    if(state.q) p.set('q', state.q);
    for(const [k,v] of Object.entries(state.filters)) if(v) p.set(k,v);
    p.set('limit','40');
    return p.toString();
  }
  let searchRequest=0;
  async function run(){
    const request=++searchRequest,query=qs();
    results.innerHTML='<div class="loading">Searching…</div>';
    let d;
    try {d=await api('/search?'+query);}
    catch(error){if(request===searchRequest && results.isConnected && query===qs()) offerRetry(results,'检索暂时失败，可以保持当前条件重试。',run);return;}
    if(request!==searchRequest || !results.isConnected || query!==qs()) return;
    const fill = (sel, key, label, list) => {
      sel.innerHTML = '<option value="">'+label+'(全部)</option>' + list.map(f=>'<option value="'+esc(f.key)+'">'+esc(f.key)+' ('+f.count+')</option>').join('');
      sel.value = state.filters[key]||'';
      sel.onchange = () => { state.filters[key]=sel.value||undefined; run(); };
    };
    fill(selY,'year','年份', d.facets.years);
    fill(selC,'court','法院', d.facets.courts);
    fill(selJ,'juris','法域', d.facets.jurisdictions);
    fill(selT,'type','类型', d.facets.types);

    facets.innerHTML='';
    facets.appendChild(el('span','fchip','命中 <b>'+fmt(d.total)+'</b> 篇'));
    const chipFor = (f) => {
      const k = f.topic||f.key;
      const b = el('button','fchip', esc(k)+' <b>'+f.count+'</b>');
      b.dataset.on = state.filters.topic===k?'1':'0';
      b.onclick = () => { state.filters.topic = state.filters.topic===k?undefined:k; run(); };
      return b;
    };
    for(const f of d.facets.topics.slice(0,8)) facets.appendChild(chipFor(f));
    if(d.facets.topics.length>8){
      const more = el('details','moref');
      more.innerHTML = '<summary>更多话题 ('+(d.facets.topics.length-8)+')</summary>';
      const mrow = el('div','facets'); mrow.style.marginBottom = '0';
      for(const f of d.facets.topics.slice(8,20)) mrow.appendChild(chipFor(f));
      more.appendChild(mrow); facets.appendChild(more);
    }
    if(Object.values(state.filters).some(Boolean)){
      const c = el('button','fchip','✕ 清除筛选');
      c.onclick = () => { state.filters={}; run(); };
      facets.appendChild(c);
    }

    results.innerHTML='';
    for(const p of d.results){
      const post = el('article','post');
      let h = '<h4>'+esc(p.title)+' <a href="'+esc(p.url)+'" target="_blank" rel="noopener" style="font-size:11px;font-weight:400">\u539f\u6587 \u2197</a></h4>';
      h += '<div class="meta"><span>'+esc(p.date||'—')+'</span><span>'+esc(p.type)+'</span><span>'+(p.topics||[]).map(esc).join(' · ')+'</span></div>';
      h += '<p class="sum">'+esc(p.summary)+'</p>';
      if((p.cases||[]).length){
        const cHtml = (c)=>'<button class="linkbtn" data-case="'+esc(c.name)+'">'+esc(c.name)+'</button>'+(c.citation?' <span class="mono">'+esc(c.citation)+'</span> <button class="vbtn" data-verify="'+esc(c.citation)+'" title="核验引证">验</button>':'');
        h += '<div class="cs"><b>判例:</b> ' + p.cases.slice(0,3).map(cHtml).join(' ; ');
        if(p.cases.length>3) h += ' <details class="morec"><summary>等 '+(p.cases.length-3)+' 个</summary><div>' + p.cases.slice(3).map(cHtml).join(' ; ') + '</div></details>';
        h += '</div>';
      }
      if((p.statutes||[]).length) h += '<div class="cs"><b>条文:</b> '+p.statutes.slice(0,5).map(esc).join(' ; ')+'</div>';
      h += '<div class="vout" style="display:none"></div>';
      post.innerHTML = h;
      results.appendChild(post);
    }
    results.onclick = async (ev) => {
      const t = ev.target.closest('button'); if(!t) return;
      if(t.dataset.case){ state.sub='cases'; state.caseQ=t.dataset.case; route(); window.scrollTo(0,0); return; }
      if(t.dataset.verify){
        const box = t.closest('article').querySelector('.vout');
        const request=String(Number(box.dataset.request||0)+1); box.dataset.request=request;
        box.setAttribute('role','status'); box.style.display='block'; box.textContent='正在核对引证…';
        try{
          const v = await api('/verify?cite='+encodeURIComponent(t.dataset.verify));
          if(!box.isConnected || box.dataset.request!==request) return;
          const a = v.authority||{};
          box.innerHTML = '<span class="mono">'+esc(a.cite||t.dataset.verify)+'</span><br>'
            + (v.found ? '库内身份匹配；未验证法律命题。' : v.citation_mismatch || v.status==='citation-mismatch' ? '姓名与引证未能一致对应，请核对。' : '本库未匹配；这不表示判例不存在。');
          for(const record of v.evidence_records||[]){
            const row=el('div','auth');
            row.innerHTML=esc(record.case||record.name||'')+' <span class="badge v">'+esc(record.verified||'unverified')+'</span>'+(record.where?' <span class="tiny">'+esc(record.where)+'</span>':'');
            appendEvidence(row,record);box.appendChild(row);
          }
          if(v.hklii){
            const online=v.hklii;
            const message=online.exists===true ? 'HKLII 返回的中性引证匹配（'+(online.date||'')+'）；未核查当事人名称、引注段落或法律命题。'
              : online.status==='english-version-unavailable' ? '英文入口未返回判决；其他语言版本及判例是否存在仍待核对。'
              : online.status?.startsWith('not-requested') ? '本次未进行在线核查；请先解决日期或身份匹配问题。'
              : '在线核查未能确认，请稍后重试；不能据此认定判例不存在。';
            box.appendChild(el('div',null,esc(message)));
          }
        }catch(e){ if(box.isConnected && box.dataset.request===request) box.textContent='引证核查暂时失败，请重试。'; }
      }
    };
    if(!d.results.length) results.innerHTML='<div class="loading">无命中。</div>';
  }
  let t=null;
  inp.oninput = () => { state.q=inp.value; searchRequest++; results.textContent='正在检索…'; clearTimeout(t); t=setTimeout(run,220); };
  run();
}

async function viewCases(main){
  main.innerHTML='';
  main.appendChild(el('h1','page','判例索引 <span style="color:var(--ink3);font-size:.55em;font-weight:500">Case index</span>'));
  main.appendChild(el('p','lede','语料中出现的全部判例,按被讨论次数排序。点击行展开引用该判例的文章。'));

  row.append(inp, selJ); main.appendChild(row);

  let caseRequest=0;
  async function run(){
    const request=++caseRequest;
    box.innerHTML='<div class="loading" style="padding:16px">Loading…</div>';
    const p = new URLSearchParams({limit:'120'});
    if(inp.value) p.set('q',inp.value);
    if(selJ.value) p.set('juris',selJ.value);
    let d;
    try {d=await api('/cases?'+p);}
    catch(error){if(request===caseRequest && box.isConnected) offerRetry(box,'判例列表暂时加载失败，可以保持当前条件重试。',run);return;}
    if(request!==caseRequest || !box.isConnected) return;
    const t = el('table','data');
    t.innerHTML = '<thead><tr><th>判例</th><th>引证</th><th>法院 / 法域</th><th style="text-align:right">被讨论</th></tr></thead>';
    const tb = el('tbody');
    for(const c of d.results){
      const tr = el('tr');
      tr.innerHTML = '<td><button class="linkbtn">'+esc(c.name)+'</button></td>'
        + '<td class="mono" style="font-size:11.5px;color:var(--ink2)">'+c.citations.slice(0,2).map(esc).join('<br>')+'</td>'
        + '<td style="font-size:12px;color:var(--ink2)">'+c.courts.map(esc).join(', ')
        + ' <span class="cnt">'+c.jurisdictions.map(esc).join(' \u00b7 ')+'</span></td>'
        + '<td class="num">'+c.count+'</td>';
      tr.querySelector('.linkbtn').onclick = async () => {
        const nx = tr.nextElementSibling;
        if(nx && nx.dataset.detail){ nx.remove(); return; }
        const button=tr.querySelector('.linkbtn');button.disabled=true;
        let det;
        try {det=await api('/case?name='+encodeURIComponent(c.name));}
        catch(error){det={message:'关联资料暂时加载失败，请重新展开重试。'};}
        finally {button.disabled=false;}
        if(!tr.isConnected) return;
        const dr = el('tr'); dr.dataset.detail='1';
        dr.innerHTML = '<td colspan="4" style="background:var(--surface2)">'
          + (Array.isArray(det.posts) ? det.posts.map(p=>'<div style="margin:5px 0"><span>'+esc(p.title)+'</span>'
      + ' <a href="'+esc(p.url)+'" target="_blank" rel="noopener" style="font-size:11px">\u539f\u6587 \u2197</a>'
            + ' <span class="mono" style="color:var(--ink3);font-size:11px">'+esc(p.date||'')+'</span>'
            + '<div style="font-size:12.5px;color:var(--ink2)">'+esc(p.summary)+'</div></div>').join('')
          : esc(det.message||'该名称未能唯一对应记录，请补充完整引证。')) + '</td>';
        tr.after(dr);
      };
      tb.appendChild(tr);
    }
    t.appendChild(tb); box.innerHTML=''; box.appendChild(t);
    if(!d.results.length) box.appendChild(el('p','loading','未找到匹配的判例，请调整关键词或法域。'));
    main.querySelector('.lede').textContent = '语料中共 '+fmt(d.total)+' 个判例(当前筛选),按被讨论次数排序。点击判例名展开引用它的文章。';
  }
  let t2=null;
  inp.oninput = () => { caseRequest++; box.textContent='正在检索…'; clearTimeout(t2); t2=setTimeout(run,220); };
  selJ.onchange = run;
  run();
}

async function viewGraph(main){
  main.innerHTML='';
  main.appendChild(el('h1','page','学说共现图谱 <span style="color:var(--ink3);font-size:.55em;font-weight:500">Doctrine co-occurrence</span>'));
  main.appendChild(el('p','lede','节点为学说标签(大小 = 出现篇数),连边为同篇共现(粗细 = 共现次数)。这是语料自己长出来的学说邻接结构——建要件图时哪些学说该连 typed edge,可以从这里读。'));
  const d = await api('/graph?n=46&min=3');
  const box = el('div','card'); box.style.padding='6px';
  const cv = el('canvas'); cv.style.cssText='width:100%;height:560px;display:block';
  box.appendChild(cv); main.appendChild(box);
  const info = el('p','fig-foot','拖动可平移;共 '+d.nodes.length+' 个节点 / '+d.links.length+' 条边(阈值 ≥3 次共现)。');
  main.appendChild(info);

  const dpr = Math.min(devicePixelRatio||1, 2);
  const W = box.clientWidth-12, H = 560;
  cv.width = W*dpr; cv.height = H*dpr;
  const ctx = cv.getContext('2d'); ctx.scale(dpr,dpr);

  const maxC = Math.max(...d.nodes.map(n=>n.count));
  const N = d.nodes.map((n,i)=>({...n, x: W/2 + Math.cos(i/d.nodes.length*6.283)*Math.min(W,H)*0.34,
                                       y: H/2 + Math.sin(i/d.nodes.length*6.283)*Math.min(W,H)*0.34, vx:0, vy:0,
                                       r: 5 + 15*Math.sqrt(n.count/maxC)}));
  const idx = new Map(N.map(n=>[n.topic,n]));
  const L = d.links.map(l=>({s:idx.get(l.source), t:idx.get(l.target), w:l.weight})).filter(l=>l.s&&l.t);
  const maxW = Math.max(...L.map(l=>l.w));
  let ox=0, oy=0, drag=null;

  cv.onpointerdown = e => drag={x:e.clientX,y:e.clientY,ox,oy};
  cv.onpointermove = e => { if(drag){ ox=drag.ox+(e.clientX-drag.x); oy=drag.oy+(e.clientY-drag.y); } };
  const endDrag = () => drag=null;
  window.addEventListener('pointerup',endDrag);

  function step(){
    for(let i=0;i<N.length;i++){
      const a=N[i];
      for(let j=i+1;j<N.length;j++){
        const b=N[j]; let dx=b.x-a.x, dy=b.y-a.y; let d2=dx*dx+dy*dy||1;
        const f = 900/d2; const dd=Math.sqrt(d2);
        a.vx-=dx/dd*f; a.vy-=dy/dd*f; b.vx+=dx/dd*f; b.vy+=dy/dd*f;
      }
      a.vx += (W/2-a.x)*0.0012; a.vy += (H/2-a.y)*0.0012;
    }
    for(const l of L){
      const dx=l.t.x-l.s.x, dy=l.t.y-l.s.y, dd=Math.hypot(dx,dy)||1;
      const f = (dd-110)*0.0016*(0.5+l.w/maxW);
      l.s.vx+=dx/dd*f; l.s.vy+=dy/dd*f; l.t.vx-=dx/dd*f; l.t.vy-=dy/dd*f;
    }
    for(const n of N){ n.vx*=0.86; n.vy*=0.86; n.x+=n.vx; n.y+=n.vy; }
  }
  const css = getComputedStyle(document.documentElement);
  function draw(){
    const ink = css.getPropertyValue('--ink').trim(), ink3=css.getPropertyValue('--ink3').trim();
    const line = css.getPropertyValue('--line').trim(), acc=css.getPropertyValue('--accent').trim();
    ctx.clearRect(0,0,W,H);
    ctx.save(); ctx.translate(ox,oy);
    for(const l of L){
      ctx.strokeStyle=line; ctx.globalAlpha=0.5+0.5*(l.w/maxW); ctx.lineWidth=0.6+2.4*(l.w/maxW);
      ctx.beginPath(); ctx.moveTo(l.s.x,l.s.y); ctx.lineTo(l.t.x,l.t.y); ctx.stroke();
    }
    ctx.globalAlpha=1;
    for(const n of N){
      ctx.fillStyle=acc; ctx.globalAlpha=0.82;
      ctx.beginPath(); ctx.arc(n.x,n.y,n.r,0,6.284); ctx.fill();
      ctx.globalAlpha=1;
      ctx.fillStyle = n.r>10?ink:ink3;
      ctx.font = (n.r>10?'600 12px':'400 10.5px')+' "IBM Plex Sans",sans-serif';
      ctx.textAlign='center';
      ctx.fillText(n.topic, n.x, n.y+n.r+11);
    }
    ctx.restore();
  }
  let frames=0;
  (function loop(){
    if(!cv.isConnected){ window.removeEventListener('pointerup',endDrag); return; }
    if(frames++<420) step(); draw(); requestAnimationFrame(loop);
  })();
}

/* ── typed legal-test logic ──────────────────────────── */
const SF = {};   // factor id -> true | false | undefined
let SCMOD = 'HKJUR';
let SCVIEW = 0;
const LOGIC_FALLBACK = {
  'conjunctive':{zh:'合取要件'},
  'disjunctive-gateway':{zh:'择一门槛'},
  'balancing':{zh:'多因素权衡'},
  'threshold-discretion':{zh:'门槛后裁量'},
  'presumption-rebuttal':{zh:'推定与反驳'},
};
const logicMeta = (index,type) => index?.test_types?.[type] || LOGIC_FALLBACK[type] || {zh:type};
const moduleLogicTypes = module => {
  const types = Array.isArray(module.logic_types) ? module.logic_types : (module.stages||[]).map(stage=>stage.test_type);
  return [...new Set(types.filter(type=>LOGIC_FALLBACK[type]))];
};
const moduleMatchesFilter = (module,filter=SCFILTER) => (!filter.posture || (module.litigation_postures||[]).includes(filter.posture))
  && (!filter.track || module.litigation_track===filter.track);
const stageRole = (stage,factor) => {
  if(stage.test_type==='conjunctive') return '合取项';
  if(stage.test_type==='disjunctive-gateway') return factor.dispositive ? '独立门槛' : '择一候选';
  if(stage.test_type==='threshold-discretion') return factor.gate ? '门槛' : factor.override ? '裁量／覆盖' : '待标注角色';
  if(stage.test_type==='presumption-rebuttal') return factor.role==='trigger' ? '推定触发' : factor.role==='rebuttal' ? '反驳事项' : '待标注角色';
  return '逻辑项';
};
async function viewScored(main){

    if(view!==SCVIEW || state.mode!=='scored' || SCMOD!==moduleId) return;
    throw error;
  }
  if(view!==SCVIEW || state.mode!=='scored' || SCMOD!==moduleId) return;
  for(const k of Object.keys(SF)) delete SF[k];
  main.innerHTML='';
  main.appendChild(el('p','crumb','判断逻辑登记表 Registry v'+esc(reg.version)+' · '+reg.total_modules+' 个模块 · '+Object.keys(idx.test_types||{}).length+' 类判断逻辑'));
  // Module picker: matter track is the grouping axis; spear/shield are

  const pick = el('div');
  pick.setAttribute('role','radiogroup');
  pick.setAttribute('aria-label','选择法律测试模块');
  let visibleModules=reg.modules.filter(module=>moduleMatchesFilter(module));
  if(!visibleModules.length){ SCFILTER={posture:null,track:null}; visibleModules=reg.modules; }
  for(const g of LITIGATION_TRACK_ORDER){
    const ms = visibleModules.filter(m=>m.litigation_track===g);
    if(!ms.length) continue;
    const sec = el('div','rgroup');
    const track=LITIGATION_TRACKS[g];
    sec.innerHTML = '<span class="rlab">'+esc(track?.label||g)+'</span><span class="cnt">事项轨道 · '+esc(g)+'</span> <span class="tiny">'+esc(track?.description||'')+'</span>';
    const row = el('div','jbar');
    for(const m of ms){
      const b = el('button','jchip'+(m.id===SCMOD?' on':''));
      b.type='button';
      b.setAttribute('role','radio');
      b.setAttribute('aria-checked', String(m.id===SCMOD));

      const types = moduleLogicTypes(m);
      const logicTags = types.map(type=>'<span class="tag logic">'+esc(logicMeta(idx,type).zh)+'</span>').join('');
      const sourceCounts = m.source_counts || (m.corpus_hits==null ? {} : {hklandlaw:m.corpus_hits});
      const sourceTag = sourceCounts.hklandlaw==null ? ''
        : '<span class="tag source">hklandlaw · '+esc(sourceCounts.hklandlaw)+'篇</span>';
      const balancing = (m.stages||[]).filter(stage=>stage.test_type==='balancing');
      const incomplete = balancing.some(stage=>['unassigned','partial'].includes(stage.weight_status));
      const modelTag = balancing.length ? '<span class="tag model">模型 · '+(incomplete?'份量待补':'份量区间')+'</span>' : '';
      const postureTags=(m.litigation_postures||[]).map(posture=>'<span class="tag posture-'+esc(posture)+'">'+esc(LITIGATION_POSTURES[posture]?.label||posture)+'</span>').join('');
      const ownMotionIds=m.court_own_motion_summary?.stage_ids||[];
      const ownMotionTag=ownMotionIds.length?'<span class="tag track">含依职权阶段 · '+esc(ownMotionIds.join(' / '))+'</span>':'';
      b.innerHTML = '<span class="module-name">'+esc(m.zh)+'</span><span class="meta-tags">'+postureTags+ownMotionTag+logicTags+sourceTag+modelTag+'</span>';
      b.setAttribute('aria-label',m.zh+'；诉讼姿态 '+(m.litigation_postures||[]).map(posture=>LITIGATION_POSTURES[posture]?.label||posture).join('、')+'；判断逻辑 '+types.map(type=>logicMeta(idx,type).zh).join('、')
        +(ownMotionIds.length?'；含依职权阶段 '+ownMotionIds.join('、'):'')
        +(sourceCounts.hklandlaw==null?'':'；hklandlaw '+sourceCounts.hklandlaw+'篇'));
      b.onclick = () => {
        SCCHOOSEROPEN=true;
        SCMOD=m.id;
        route({focusTarget:'module-radio'});
        window.scrollTo(0,0);
      };
      b.onkeydown = event => {
        if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End'].includes(event.key)) return;
        const radios=[...pick.querySelectorAll('[role="radio"]')];
        const current=radios.indexOf(b);
        const next=event.key==='Home'?0:event.key==='End'?radios.length-1
          :(current+(['ArrowRight','ArrowDown'].includes(event.key)?1:-1)+radios.length)%radios.length;
        event.preventDefault();
        radios[next].click();
      };
      row.appendChild(b);
    }
    sec.appendChild(row); pick.appendChild(sec);
  }
  main.appendChild(el('h2','claim',esc(mod.zh)+' <span style="color:var(--ink3);font-size:.6em;font-weight:500">'+esc(mod.en)+'</span>'));
  main.appendChild(el('p','claimdesc',esc(mod.note)));
  const selectedSummary = reg.modules.find(module=>module.id===moduleId) || mod;
  appendLitigationPosition(main,selectedSummary,reg);
  const selectedTypes = moduleLogicTypes(selectedSummary);
  const selectedSources = selectedSummary.source_counts || (selectedSummary.corpus_hits==null ? {} : {hklandlaw:selectedSummary.corpus_hits});
  main.appendChild(el('div','logic-line',selectedTypes.map(type=>'<span class="tag logic">判断逻辑 · '+esc(logicMeta(idx,type).zh)+'</span>').join('')
    +(selectedSources.hklandlaw==null?'':'<span class="tag source">语料来源 · hklandlaw · '+esc(selectedSources.hklandlaw)+'篇</span>')));
  const chooser=el('details','card');
  const activeFilter=SCFILTER.posture ? {kind:'诉讼姿态',id:SCFILTER.posture,meta:LITIGATION_POSTURES[SCFILTER.posture]}
    : SCFILTER.track ? {kind:'事项轨道',id:SCFILTER.track,meta:LITIGATION_TRACKS[SCFILTER.track]} : null;
  chooser.innerHTML='<summary class="stt">切换法律测试模块 · '+visibleModules.length+(activeFilter?' / '+reg.total_modules+' 项（已筛选）':' 项')+'</summary>';
  chooser.open=!!activeFilter||SCCHOOSEROPEN;
  chooser.addEventListener('toggle',()=>{SCCHOOSEROPEN=chooser.open;});
  if(activeFilter){
    chooser.open=true;
    const filterBar=el('div','chips');
    filterBar.appendChild(el('span','tag track','当前筛选 · '+esc(activeFilter.kind)+' · '+esc(activeFilter.meta?.label||activeFilter.id)));
    const clear=el('button','chip sm','显示全部模块');
    clear.type='button';
    clear.onclick=()=>{SCFILTER={posture:null,track:null};route({focusTarget:'heading'});};
    filterBar.appendChild(clear);
    chooser.appendChild(filterBar);
  }
  chooser.appendChild(pick); main.appendChild(chooser);
  main.appendChild(el('p','tiny','⚠ '+esc(reg.principle)));

  // test-type explainer — the important conceptual bit
  const tt = el('details','card');
  let th = '<summary class="stt">五类法律判断逻辑 — 只有多因素权衡使用权重</summary>';
  for(const [k,v] of Object.entries(idx.test_types)){
    th += '<p class="test"><code>'+esc(k)+'</code> <strong>'+esc(v.zh)+'</strong> — '+esc(v.en)+'<br><span class="tiny">处理方式：'+esc(v.scoring)+' · 输出：'+esc(v.output)+'</span></p>';
  }
  th += '<p class="test" style="border-top:1px solid var(--line2);padding-top:8px">'+esc(idx.conjunctive_note)+'</p>';
  if(idx.tiers){
    th += '<p class="test"><strong>档位与区间</strong>(区间由判词对相对份量的表述归纳,非点估计):</p><div class="tierleg">';
    for(const [k,v] of Object.entries(idx.tiers)){
      const rng = v.lo==null ? '—' : (v.lo*100)+'–'+(v.hi*100)+'%';
      th += '<span class="tierchip" data-t="'+esc(k)+'"><b>'+esc(v.zh)+'</b> '+rng+'</span>';
    }
    th += '</div>';
  }
  tt.innerHTML = th; main.appendChild(tt);
  const auWrap = el('details','card');

  // authorities
  const au = auWrap;
  au.innerHTML = '<summary class="stt">权威 Authorities</summary>' +
    mod.authorities.map(a=>'<div class="auth"><span class="case">'+esc(a.case)+'</span><span class="cite">'+esc(a.cite)+'</span><span class="badge '+(a.verified==='web'?'v':'n')+'">'+esc(a.verified)+'</span> <span class="tiny">'+esc(a.role)+'</span></div>').join('');
  au.querySelectorAll('.auth').forEach((row,i)=>appendEvidence(row,mod.authorities[i]));
  main.appendChild(au);

  const out = el('div'); out.id='sc_out';
  for(const st of mod.stages){
    const sec = el('section','elem');
    const isBalancing = st.test_type==='balancing';
    sec.appendChild(el('h3',null,esc(st.zh)+' <span class="tag logic">判断逻辑 · '+esc(logicMeta(idx,st.test_type).zh)+'</span> '+litigationTags(st)+' <span class="cnt">'+esc(st.test_type)+'</span>'));
    sec.appendChild(el('p','ezh',esc(st.rule||st.en)));
    if(st.litigation_note) sec.appendChild(el('p','test stage-position-note',esc(st.litigation_note)));
    if(st.weight_note) sec.appendChild(el('p','tiny','⚠ '+esc(st.weight_note)));
    const all = (st.factors||[]).concat(st.counter_factors||[]);
    const tw = el('div','tblwrap');
    let h='<table><thead><tr><th>因素</th><th>'+(isBalancing?'相对份量（编者档位）':'逻辑作用')+'</th><th>取证</th><th>事实状态</th></tr></thead><tbody>';
    for(const f of all){
      let w, bar='';
      if(isBalancing && Number.isFinite(f.weight_low) && Number.isFinite(f.weight_high)){
        const [lo,hi]=[Math.abs(f.weight_low)*100,Math.abs(f.weight_high)*100].sort((a,b)=>a-b);
        const neg=(st.counter_factors||[]).some(c=>c.id===f.id), scale=Math.max(30,hi);
        w = (neg?'反向 ':'')+lo.toFixed(0)+'–'+hi.toFixed(0)+'%';
        bar = '<div class="rng"><div class="rngbar" style="left:'+(lo/scale*100).toFixed(0)+'%;width:'+((hi-lo)/scale*100).toFixed(0)+'%;background:'+(neg?'var(--warn)':'var(--accent)')+'"></div></div>'
            + '<span class="tierchip" data-t="'+esc(f.tier||'')+'">'+esc(f.tier||'')+'</span>';
      } else {
        w = isBalancing ? '份量待补' : stageRole(st,f);
      }
      h += '<tr><td><strong>'+esc(f.zh)+'</strong><br><span class="tiny">'+esc(f.en)+'</span>'+(f.note?'<br><span class="tiny" style="color:var(--warn)">'+esc(f.note)+'</span>':'')+'</td>'
        + '<td class="n">'+w+' '+bar+'</td>'
        + '<td><span class="tiny">'+esc(f.evidence||'—')+'</span></td>'
        + '<td><div class="tri" data-f="'+esc(f.id)+'">'
        +   '<button data-v="1">存在</button><button data-v="0">不存在</button><button data-v="?" class="on">待确认</button></div></td></tr>';
    }
    h+='</tbody></table>'; tw.innerHTML=h; sec.appendChild(tw);
    out.appendChild(sec);
  }
  main.appendChild(out);

  const res = el('section','elem'); res.id='sc_res';
  res.innerHTML = '<h3>证据与阶段结果</h3><p class="ezh">切换事实状态后更新。只有多因素权衡阶段显示模型情景区间；它不是胜诉概率。</p><div id="sc_body" aria-live="polite"><p class="tiny">正在检查证据状态…</p></div>';
  main.appendChild(res);

  const cal = el('section','elem');
  cal.appendChild(el('h3',null,'多因素权衡 · 数值份量缺口 <span class="cnt">'+cq.total_factors+' 因素</span>'));
  cal.appendChild(el('p','ezh','本表只统计多因素权衡阶段中尚未设置份量区间的因素；合取、择一、门槛裁量和推定反驳不进入本表。'));
  const cwr = el('div','tblwrap');
  let cch='<table><thead><tr><th>模块</th><th>阶段</th><th>待补份量区间</th><th>hklandlaw 相关文章</th></tr></thead><tbody>';
  for(const r of cq.rows) cch+='<tr><td><strong>'+esc(r.zh)+'</strong></td><td>'+esc(r.stage_zh)+'</td><td class="n">'+r.factors_unassigned+' / '+r.factors_total+'</td><td class="n">'+esc(r.source_counts?.hklandlaw??r.corpus_hits??'—')+'</td></tr>';
  cch+='</tbody></table>'; cwr.innerHTML=cch; cal.appendChild(cwr);
  cal.appendChild(el('p','tiny','份量区间完整也不等于经验校准完成；经验校准仍需另行编码判决结果并验证模型。hklandlaw 数字只是相关文章覆盖量。'));
  main.appendChild(cal);

  const resultBody = res.querySelector('#sc_body');
  const updateScore = createScoreUpdater({
    isCurrent:()=>res.isConnected && view===SCVIEW && state.mode==='scored' && SCMOD===moduleId,
    onLoading:()=>{resultBody.textContent='正在更新证据状态…';resultBody.setAttribute('aria-busy','true');},
    onResult:html=>{resultBody.innerHTML=html;resultBody.setAttribute('aria-busy','false');},
    onError:message=>{
      resultBody.replaceChildren(el('p','test','阶段判断暂未完成，请重试。'),el('p','tiny',esc(message)));
      const retry=el('button','jchip','重试判断');
      retry.onclick=()=>updateScore(SF);
      resultBody.appendChild(retry);resultBody.setAttribute('aria-busy','false');
    },
    fetchScore:async(facts,signal)=>{
      const r=await request('/score',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({module:moduleId,facts}),signal});
      const data=r.data;
      if(!r.ok || data.error) throw new Error(Array.isArray(data.errors)?data.errors.join('；'):(data.error||'评分服务暂不可用'));
      return data;
    },
  });
  main.querySelectorAll('.tri').forEach(g=>{
    const factor = mod.stages.flatMap(s=>(s.factors||[]).concat(s.counter_factors||[])).find(f=>f.id===g.dataset.f);
    g.setAttribute('role','group');
    g.setAttribute('aria-label',factor?.zh||g.dataset.f);
    g.querySelectorAll('button').forEach(b=>{
      b.setAttribute('aria-pressed',String(b.classList.contains('on')));
      b.onclick = () => {
        g.querySelectorAll('button').forEach(x=>{x.classList.remove('on');x.setAttribute('aria-pressed','false');});
        b.classList.add('on');
        b.setAttribute('aria-pressed','true');
        const v=b.dataset.v, id=g.dataset.f;
        if(v==='?') delete SF[id]; else SF[id] = v==='1';
        updateScore(SF);
      };
    });
  });

  updateScore(SF);
}

let navigationRequest=0;
async function route({focusTarget=null}={}){
  const request=++navigationRequest;
  renderModes(); renderContext();
  // Each navigation owns its container. A late response can only alter the
  // detached previous view, never the page the user has since opened.
  const main = document.createElement('div');
  $('#main').replaceChildren(main);
  main.innerHTML = '<div class="loading" role="status" aria-live="polite">正在加载当前页面…</div>';
  try{
    if(state.mode==='doctrine') await viewDoctrine(main);
    else if(state.mode==='corpus'){
      const bar = el('nav','subs');
      for(const [k,label] of SUBS){
        const b = el('button',null,label);
        b.setAttribute('aria-current', String((state.sub||'corpus')===k));
        b.onclick = () => { state.sub=k; route(); };
        bar.appendChild(b);
      }
      main.innerHTML=''; main.appendChild(bar);
      const body = el('div'); main.appendChild(body);
      const sub = state.sub||'corpus';
      if(sub==='cases') await viewCases(body);
      else if(sub==='topics') await viewTopics(body);
      else if(sub==='graph') await viewGraph(body);
      else await viewCorpus(body);
    }
    else if(state.mode==='maint') await viewMaint(main);
    else if(state.mode==='scored') await viewScored(main);
    else await viewApi(main);
  }catch(e){
    if(request===navigationRequest){
      main.innerHTML = '<div class="card" role="alert"><h4>加载失败</h4><p class="test">'+esc(e.message)+'</p><button class="chip sm" type="button" data-page-retry>重试加载</button></div>';
      const retry=main.querySelector?.('[data-page-retry]');
      if(retry) retry.onclick=()=>route();
    }
  }
  if(request===navigationRequest){
    renderContext();
    const focusNode=focusTarget==='claim-select' ? $('#context select.pick')
      : focusTarget==='module-radio' ? main.querySelector('[role="radio"][aria-checked="true"]')
      : focusTarget==='heading' ? (main.querySelector('h1,h2')||main.querySelector('[role="alert"] h4')) : null;
    if(focusNode){
      if(focusTarget==='heading') focusNode.tabIndex=-1;
      focusNode.focus({preventScroll:true});
    }
  }
}

$('#gq').addEventListener('input', e => {
  state.q = e.target.value;
  if(state.mode!=='corpus'){ state.mode='corpus'; state.filters={}; } state.sub='corpus';
  clearTimeout(window.__gt); window.__gt = setTimeout(()=>state.tax && state.elements && state.stats ? route() : init(), 260);
});

const init=createBootstrap({
  load:signal=>Promise.all([api('/taxonomy',{signal}),api('/elements',{signal}),api('/stats',{signal})]),
  commit:([tax,els,stats])=>{state.tax=tax;state.elements=els;state.stats=stats;},
  onLoading:()=>{
    renderModes();renderContext();
    $('#main').innerHTML='<div class="loading" role="status">正在连接并读取资料…</div>';
  },
  onError:error=>{
    const main=$('#main');
    main.innerHTML='<div class="card" role="alert"><h4>暂时无法读取资料</h4><p class="test">'+esc(error.message)+'</p><button class="chip sm" type="button" data-startup-retry>重试连接并加载</button></div>';
    main.querySelector('[data-startup-retry]').onclick=()=>init();
  },
  onReady:()=>route(),
});
$('#connectionRetry').onclick=async()=>{
  const button=$('#connectionRetry');button.disabled=true;
  try{
    if(!state.tax || !state.elements || !state.stats) await init();
    else await api('/health'); // Check only; do not replay scoring or proposal POSTs.
  }catch{} // The request helper already displays the actual connection failure.
  finally{button.disabled=false;}
};
init();
</script>
