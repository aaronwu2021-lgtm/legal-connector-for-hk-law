<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>要件漂移图谱 · Doctrine Drift Atlas</title>
<meta name="description" content="English-common-law element tests, per-jurisdiction overlays, case-law drift timelines, and a 745-post Hong Kong land law corpus — served over a live API.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#FAF9F7; --surface:#FFFFFF; --surface2:#F4F2ED; --ink:#1D1B18; --ink2:#5D584F; --ink3:#8A847A;
  --line:#E5E1D8; --line2:#EFECE5; --accent:#8C2F39; --accent-soft:#F4E7E8;
  --warn:#B4530A; --warn-soft:#FBEDE1; --ok:#1F7A4D; --ok-soft:#E3F1E9;
  --good:#2E7D4F; --good-bg:#E9F2EC; --note:#8A6100; --note-bg:#F6EEDC;
  --stub:#8A847A; --stub-bg:#F0EEE9;
  --jEN:#4568B8; --jHK:#C4703C; --jSG:#1F9472; --jAU:#8461B8;
  --shadow:0 1px 2px rgba(29,27,24,.05),0 4px 16px rgba(29,27,24,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#161513; --surface:#1F1D1A; --surface2:#26241F; --ink:#ECE8E0; --ink2:#A69F92; --ink3:#7A7468;
  --line:#343029; --line2:#2A2722; --accent:#C9737C; --accent-soft:#3A2426;
  --warn:#E08A45; --warn-soft:#2E2318; --ok:#5BB98A; --ok-soft:#16271F;
  --good:#5CB985; --good-bg:#24312A; --note:#D9A94A; --note-bg:#38301F;
  --stub:#7A7468; --stub-bg:#26241F;
  --jEN:#5B82E0; --jHK:#C8792F; --jSG:#27A176; --jAU:#9B6FD9;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  --bg:#161513; --surface:#1F1D1A; --surface2:#26241F; --ink:#ECE8E0; --ink2:#A69F92; --ink3:#7A7468;
  --line:#343029; --line2:#2A2722; --accent:#C9737C; --accent-soft:#3A2426;
  --warn:#E08A45; --warn-soft:#2E2318; --ok:#5BB98A; --ok-soft:#16271F;
  --good:#5CB985; --good-bg:#24312A; --note:#D9A94A; --note-bg:#38301F;
  --stub:#7A7468; --stub-bg:#26241F;
  --jEN:#5B82E0; --jHK:#C8792F; --jSG:#27A176; --jAU:#9B6FD9;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font:15px/1.6 "IBM Plex Sans","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;}
a{color:var(--accent)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}

/* shell */
.topbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;padding:9px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:9px;margin-right:4px}
.brand b{font:600 17px/1 Spectral,"Songti SC",serif}
.brand span{font:500 10px/1 "IBM Plex Mono",monospace;letter-spacing:.12em;color:var(--accent);text-transform:uppercase}
.gsearch{flex:1;min-width:180px;max-width:520px;position:relative}
.gsearch input{width:100%;padding:7px 11px 7px 30px;border:1px solid var(--line);border-radius:7px;
  background:var(--bg);color:var(--ink);font:inherit;font-size:13.5px}
.gsearch .ic{position:absolute;left:10px;top:8px;color:var(--ink3);font-size:13px}
.modes{display:flex;gap:2px;flex-wrap:wrap}
.modes button{background:none;border:0;border-bottom:2px solid transparent;color:var(--ink2);
  padding:6px 10px;font-size:13.5px;border-radius:0}
.modes button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.modes button:hover{color:var(--ink)}
.apihint{margin-left:auto;font:400 11px/1 "IBM Plex Mono",monospace;color:var(--ink3)}
.apihint b{color:var(--good);font-weight:500}

.wrap{max-width:1340px;margin:0 auto;padding:20px 16px 90px}
.layout{display:grid;grid-template-columns:250px 1fr;gap:26px;align-items:start}
.rail{position:sticky;top:64px;max-height:calc(100vh - 84px);overflow:auto}
.rail h3{font:500 10.5px/1 "IBM Plex Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);
  margin:16px 0 6px;padding-bottom:5px;border-bottom:1px solid var(--line)}
.rail h3:first-child{margin-top:0}
.leaf{display:flex;align-items:baseline;gap:7px;width:100%;text-align:left;background:none;border:0;
  border-left:2px solid transparent;padding:5px 8px;font-size:13px;color:var(--ink2);border-radius:0 6px 6px 0}
.leaf:hover{color:var(--ink);background:var(--line2)}
.leaf[aria-current="true"]{border-left-color:var(--accent);color:var(--ink);font-weight:600;background:var(--line2)}
.leaf .en{color:var(--ink3);font-size:11px}
.leaf .tag{margin-left:auto;font:500 9px/1 "IBM Plex Mono",monospace;color:var(--stub);background:var(--stub-bg);
  border-radius:4px;padding:3px 5px;white-space:nowrap}
.leaf .tag.ok{color:var(--good);background:var(--good-bg)}

h1.page{font:600 30px/1.15 Spectral,"Songti SC",serif;margin:0 0 6px;text-wrap:balance}
.crumb{font:500 10.5px/1 "IBM Plex Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin:0 0 6px}
.lede{color:var(--ink2);max-width:70ch;margin:0 0 20px}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:9px;margin:0 0 22px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:11px 13px;box-shadow:var(--shadow)}
.tile .n{font:600 24px/1.1 "IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.tile .l{font-size:11.5px;color:var(--ink3);margin-top:2px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:0 0 10px;box-shadow:var(--shadow)}
.card h4{margin:0 0 4px;font-size:14.5px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);
  border-radius:999px;padding:4px 10px;font-size:12px;color:var(--ink2)}
.chip[aria-pressed="true"]{border-color:currentColor;color:var(--ink)}
.chip[aria-pressed="false"]{opacity:.42}
.chip .dot{width:8px;height:8px;border-radius:50%}
.chip.sm{padding:3px 8px;font-size:11.5px}
.badge{font:500 9.5px/1 "IBM Plex Mono",monospace;letter-spacing:.05em;border-radius:4px;padding:3px 6px;white-space:nowrap}
.badge.v{color:var(--good);background:var(--good-bg)}
.badge.n{color:var(--note);background:var(--note-bg)}
.badge.j{color:var(--ink2);background:var(--line2)}
.badge.drift{color:var(--accent);background:var(--accent-soft)}

/* doctrine */
.sid{font:500 11px/1 "IBM Plex Mono",monospace;color:var(--accent)}
.test{color:var(--ink2);font-size:13.5px;margin:7px 0 9px;max-width:78ch}
.auth{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:12.5px;margin-bottom:3px}
.auth .cite{font:400 11.5px/1.5 "IBM Plex Mono",monospace;color:var(--ink2)}
.jgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px;margin:0 0 22px}
.jcard{background:var(--surface);border:1px solid var(--line);border-left-width:3px;border-radius:9px;padding:12px 14px;box-shadow:var(--shadow)}
.jcard .jt{display:flex;align-items:center;gap:7px;font:600 13px/1 "IBM Plex Sans",sans-serif;margin-bottom:6px}
.jcard p{margin:0 0 5px;font-size:12.5px;color:var(--ink2)}
.jcard .rule{font-size:11.5px;color:var(--ink3)}
.kv{font-size:12px;color:var(--ink2);margin:3px 0}
.kv b{font:500 11px/1 "IBM Plex Mono",monospace;color:var(--ink)}

figure.tl{margin:12px 0 4px;padding:0}
.tlhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:5px}
.tlhead .t{font:600 13.5px/1.4 "IBM Plex Sans",sans-serif}
.tlhead .axisnote{font-size:11px;color:var(--ink3)}
.chartwrap{position:relative;overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.chartwrap svg{display:block;min-width:620px;width:100%;height:auto}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:6px;padding:8px 10px;
  font-size:12px;line-height:1.5;max-width:290px;opacity:0;z-index:5}
.tip.show{opacity:1}
.tip .tt{font:500 10px/1 "IBM Plex Mono",monospace;letter-spacing:.06em;text-transform:uppercase;opacity:.75}
.asof{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:10px 0 8px}
.asof label{font:500 10.5px/1 "IBM Plex Mono",monospace;letter-spacing:.08em;color:var(--ink3);text-transform:uppercase}
.asof input[type=range]{flex:1;min-width:150px;accent-color:var(--accent)}
.asof .yr{font:500 14px/1 "IBM Plex Mono",monospace;color:var(--accent);min-width:44px;font-variant-numeric:tabular-nums}
.standing{display:grid;grid-template-columns:repeat(auto-fit,minmax(228px,1fr));gap:8px;margin-bottom:6px}
.stand{border:1px solid var(--line);border-left-width:3px;border-radius:6px;background:var(--surface);padding:8px 11px;font-size:12px;color:var(--ink2)}
.stand .jt{display:flex;gap:6px;align-items:center;font:600 11.5px/1 "IBM Plex Sans",sans-serif;color:var(--ink);margin-bottom:4px}
.stand .cs{font:400 10.5px/1.4 "IBM Plex Mono",monospace;color:var(--ink3)}
.fig-foot{font-size:11.5px;color:var(--ink3);margin:6px 0 0;max-width:78ch}

/* corpus */
.searchrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.searchrow input,.searchrow select{padding:6px 10px;border:1px solid var(--line);border-radius:7px;
  background:var(--surface);color:var(--ink);font:inherit;font-size:13px}
.searchrow input[type=search]{flex:1;min-width:200px}
.facets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 9px;font-size:11.5px;color:var(--ink2)}
.fchip b{color:var(--ink);font-weight:500}
.fchip[data-on="1"]{border-color:var(--accent);color:var(--accent)}
.post{border-bottom:1px solid var(--line2);padding:11px 0}
.post h4{margin:0 0 3px;font-size:14.5px;line-height:1.4}
.post h4 a{color:var(--ink);text-decoration:none}
.post h4 a:hover{color:var(--accent);text-decoration:underline}
.post .meta{font:400 11px/1.5 "IBM Plex Mono",monospace;color:var(--ink3);display:flex;gap:9px;flex-wrap:wrap}
.post .sum{font-size:13px;color:var(--ink2);margin:5px 0 5px;max-width:82ch}
.post .cs{font-size:11.5px;color:var(--ink3)}
.post .cs b{color:var(--ink2);font-weight:500}
table.data{width:100%;border-collapse:collapse;font-size:13px}
table.data th{text-align:left;font:500 10.5px/1 "IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink3);border-bottom:1px solid var(--line);padding:7px 8px}
table.data td{border-bottom:1px solid var(--line2);padding:7px 8px;vertical-align:top}
table.data tr:hover td{background:var(--surface2)}
table.data td.num{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;text-align:right;color:var(--ink2)}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:9px;background:var(--surface);box-shadow:var(--shadow)}
.linkbtn{background:none;border:0;color:var(--accent);padding:0;font:inherit;text-align:left;text-decoration:underline;text-underline-offset:2px}
.bars{display:flex;flex-direction:column;gap:4px}
.bar{display:grid;grid-template-columns:190px 1fr 48px;gap:9px;align-items:center;font-size:12.5px}
.bar .t{color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .track{background:var(--line2);border-radius:3px;height:9px;overflow:hidden}
.bar .fill{height:100%;border-radius:3px;background:var(--accent)}
.bar .n{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;text-align:right;color:var(--ink3);font-size:11.5px}
pre.code{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:11px 13px;overflow-x:auto;
  font:400 12px/1.6 "IBM Plex Mono",monospace;color:var(--ink2);margin:6px 0}
pre.code b{color:var(--accent);font-weight:500}
.ep{display:grid;grid-template-columns:minmax(220px,300px) 1fr auto;gap:10px;align-items:baseline;
  border-bottom:1px solid var(--line2);padding:8px 0;font-size:12.5px}
.ep code{font:500 12px/1.5 "IBM Plex Mono",monospace;color:var(--accent)}
.ep .d{color:var(--ink2)}
.loading{color:var(--ink3);font-size:13px;padding:20px 0}
footer.site{margin-top:40px;border-top:1px solid var(--line);padding-top:14px;color:var(--ink3);font-size:11.5px;max-width:90ch}
@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  .rail{position:static;max-height:none;display:flex;gap:16px;overflow-x:auto;border-bottom:1px solid var(--line);padding-bottom:8px}
  .rail>div{min-width:190px;flex:0 0 auto}
  .bar{grid-template-columns:120px 1fr 44px}
}
.mini{height:6px;background:var(--line2);border-radius:3px;overflow:hidden;min-width:54px;display:inline-block;vertical-align:middle;width:70px}
.mini>div{height:100%;border-radius:3px}
.tiny{font:400 11px/1 "JetBrains Mono",ui-monospace,monospace;color:var(--ink3);margin-left:6px}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin:12px 0}
.tblwrap table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:560px}
.tblwrap th,.tblwrap td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line2);white-space:nowrap}
.tblwrap th{font:600 10.5px/1.3 "JetBrains Mono",ui-monospace,monospace;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3)}
.tblwrap tr:last-child td{border-bottom:0}
.tblwrap td.n{text-align:right;font-variant-numeric:tabular-nums;font-family:"JetBrains Mono",ui-monospace,monospace}
.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 7px;font:600 10.5px/1.5 "JetBrains Mono",ui-monospace,monospace}
.probe{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:9px}
.probe input{flex:1 1 150px;min-width:110px;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font:inherit;font-size:13px}
.btn{padding:7px 14px;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:7px;font:600 13px/1 inherit;cursor:pointer}
.out{background:var(--surface2,var(--bg));border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto;font:400 11.5px/1.55 "JetBrains Mono",ui-monospace,monospace;color:var(--ink2);max-height:340px}
.tri{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.tri button{border:0;background:var(--surface);color:var(--ink3);font:600 11px/1 inherit;padding:6px 9px;cursor:pointer;border-right:1px solid var(--line)}
.tri button:last-child{border-right:0}
.tri button.on{background:var(--accent);color:#fff}
ol.ev{margin:4px 0 0;padding-left:20px;font-size:13px;color:var(--ink2)}
ol.ev li{margin-bottom:4px}
nav.subs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 18px;padding-bottom:0}
nav.subs button{border:0;border-bottom:2px solid transparent;background:none;color:var(--ink3);font:600 13.5px/1 inherit;padding:8px 12px;cursor:pointer}
nav.subs button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--accent)}
details.card>summary{cursor:pointer;list-style:none;font-weight:600;font-size:14.5px}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::before{content:'▸ ';color:var(--accent)}
details.card[open]>summary::before{content:'▾ '}
.tierleg{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tierchip{display:inline-block;border:1px solid var(--line);border-radius:5px;padding:2px 7px;font:500 10.5px/1.6 "JetBrains Mono",ui-monospace,monospace;color:var(--ink2)}
.tierchip[data-t="heavy"]{border-color:var(--accent);color:var(--accent)}
.tierchip[data-t="substantial"]{opacity:.92}
.tierchip[data-t="light"],.tierchip[data-t="marginal"]{opacity:.6}
.rng{position:relative;height:7px;background:var(--line2);border-radius:4px;width:74px;display:inline-block;vertical-align:middle;margin-right:6px}
.rngbar{position:absolute;top:0;height:100%;border-radius:4px;min-width:4px}
.rng2{position:relative;height:11px;background:var(--line2);border-radius:6px;margin:6px 0 2px}
.rngspan{position:absolute;top:0;height:100%;border-radius:6px}
.rngmid{position:absolute;top:-3px;width:1px;height:17px;background:var(--ink3);opacity:.5}
.tag.warn{color:var(--warn);background:var(--warn-soft,transparent);border:1px solid var(--warn)}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><b>要件漂移图谱</b><span>Doctrine Drift Atlas</span></div>
  <div class="gsearch"><span class="ic mono">⌕</span><input id="gq" type="search" placeholder="搜索语料 · 判例 · 学说标签  (745 posts / 870 cases)" autocomplete="off"></div>
  <nav class="modes" id="modes"></nav>
  <div class="apihint mono">API <b id="apistat">…</b></div>
</div>

<div class="wrap">
  <div class="layout">
    <nav class="rail" id="rail" aria-label="navigation"></nav>
    <main id="main"><div class="loading">Loading…</div></main>
  </div>
  <footer class="site">
    要件数据集 v0.3(英/港/新/澳),判例引用为 web 级核验;favor 轴为编者标定。语料为 hklandlaw.wordpress.com 745 篇公开文章的<strong>元数据与自动生成的简短摘要</strong>(标题、日期、判例名与引证、学说标签),每条均回链原文,不复制原文内容;版权归原作者所有。本页为研究工具,不构成法律意见。
  </footer>
</div>

<script type="module">
const API = '/api';
const $ = (s, r=document) => r.querySelector(s);
const el = (t, c, h) => { const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e; };
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const jColor = j => getComputedStyle(document.documentElement).getPropertyValue('--j'+j).trim() || 'var(--ink2)';
const fmt = n => n==null?'—':n.toLocaleString('en-US');
async function api(p){ const r = await fetch(API+p); if(!r.ok) throw new Error(p+' → '+r.status); return r.json(); }

const state = { mode:'doctrine', claim:'misrepresentation', q:'', filters:{}, tax:null, elements:null, stats:null };

/* ── shell ───────────────────────────────────────────── */
const MODES = [
  ['doctrine','要件 Doctrine'], ['scored','权重 Scoring'], ['corpus','语料 Corpus'],
  ['maint','维护 Maintenance'], ['api','API / MCP'],
];
const SUBS = [['corpus','文章'],['cases','判例'],['topics','标签'],['graph','图谱']];
function renderModes(){
  const n = $('#modes'); n.innerHTML='';
  for(const [k,label] of MODES){
    const b = el('button',null,label);
    b.setAttribute('aria-current', String(state.mode===k));
    b.onclick = () => { state.mode=k; route(); };
    n.appendChild(b);
  }
}

/* ── rail ────────────────────────────────────────────── */
function renderRail(){
  const r = $('#rail'); r.innerHTML='';
  if(state.mode==='doctrine' && state.tax){
    for(const area of state.tax.areas){
      const d = el('div');
      d.appendChild(el('h3', null, esc(area.zh)+' <span style="letter-spacing:.05em">'+esc(area.en)+'</span>'));
      for(const c of area.claims){
        const b = el('button','leaf');
        b.setAttribute('aria-current', String(state.claim===c.id));
        const tag = c.status==='full' ? '<span class="tag ok">已建模</span>'
          : c.status==='planned' ? '<span class="tag">规划中</span>'
          : c.status==='xref' ? '<span class="tag">参见</span>'
          : '<span class="tag">语料</span>';
        b.innerHTML = '<span>'+esc(c.zh)+'</span><span class="en">'+esc(c.en)+'</span>'+tag;
        b.onclick = () => { state.claim=c.id; route(); window.scrollTo(0,0); };
        d.appendChild(b);
      }
      r.appendChild(d);
    }

/* ── timeline chart ──────────────────────────────────── */
const JUR = ['EN','HK','SG','AU'];
const JZH = {EN:'英国',HK:'香港',SG:'新加坡',AU:'澳大利亚'};
const jActive = {EN:true,HK:true,SG:true,AU:true};

async function renderTimeline(container, id){
  const fig = el('figure','tl');
  const wrapEl = el('div','chartwrap');
  const tip = el('div','tip');
  const NS='http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS,'svg');
  svg.setAttribute('role','img');
  wrapEl.appendChild(svg); wrapEl.appendChild(tip);

  const head = el('div','tlhead');
  fig.appendChild(head); fig.appendChild(wrapEl);
  const asofRow = el('div','asof'); const standing = el('div','standing'); const foot = el('p','fig-foot');
  fig.appendChild(asofRow); fig.appendChild(standing); fig.appendChild(foot);
  container.appendChild(fig);

  const base = await api('/timeline/'+id);
  head.innerHTML = '<div class="t">'+esc(base.id)+' · '+esc(base.title)+'</div>'+
    '<div class="axisnote">纵轴:标准倾向 ↑利于主张方 / ↓利于抗辩方(编者标定)</div>';
  foot.textContent = base.note;

  const evs = base.events.slice().sort((a,b)=>a.y-b.y);
  const minY = Math.min(...evs.map(e=>e.y));
  const lo = Math.floor((minY-4)/10)*10, hi = 2026;
  let asOf = hi;

  const W=780,H=278,padL=20,padR=66,padT=28,padB=34;
  const x = y => padL + (y-lo)/(hi-lo)*(W-padL-padR);
  const yv = f => padT + (1-(f+1)/2)*(H-padT-padB);
  svg.setAttribute('viewBox','0 0 '+W+' '+H);
  svg.setAttribute('aria-label', base.title);

  function draw(){
    svg.innerHTML='';
    const s=(n,a,t)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);if(t!=null)e.textContent=t;svg.appendChild(e);return e;};
    for(let yr=Math.ceil(lo/20)*20; yr<=hi; yr+=20){
      s('line',{x1:x(yr),x2:x(yr),y1:padT,y2:H-padB,stroke:'var(--line2)','stroke-width':1});
      s('text',{x:x(yr),y:H-12,'text-anchor':'middle',fill:'var(--ink3)','font-size':10,'font-family':'IBM Plex Mono,monospace'},String(yr));
    }
    s('line',{x1:padL,x2:W-padR,y1:yv(0),y2:yv(0),stroke:'var(--line)','stroke-width':1,'stroke-dasharray':'3 4'});
    s('text',{x:padL,y:padT-11,fill:'var(--ink3)','font-size':10,'font-family':'IBM Plex Sans,sans-serif'},'利于主张方 pro-claimant');
    s('text',{x:padL,y:H-padB+14,fill:'var(--ink3)','font-size':10,'font-family':'IBM Plex Sans,sans-serif'},'利于抗辩方 pro-defendant');
    if(asOf<hi) s('rect',{x:x(asOf),y:padT,width:Math.max(0,W-padR-x(asOf)),height:H-padT-padB,fill:'var(--line2)',opacity:.55});

    for(const j of JUR){
      if(!jActive[j]) continue;
      const mine = evs.filter(e=>e.j===j);
      if(!mine.length) continue;
      const col = jColor(j);
      const inWin = mine.filter(e=>e.y<=asOf);
      if(inWin.length>1) s('polyline',{points:inWin.map(e=>x(e.y)+','+yv(e.f)).join(' '),fill:'none',stroke:col,'stroke-width':2,'stroke-linejoin':'round','stroke-linecap':'round'});
      for(const e of mine){
        const dim = e.y>asOf;
        s('circle',{cx:x(e.y),cy:yv(e.f),r:5,fill:col,stroke:'var(--surface)','stroke-width':2,opacity:dim?0.25:1});
        const hit = s('circle',{cx:x(e.y),cy:yv(e.f),r:13,fill:'transparent',style:'cursor:pointer'});
        hit.addEventListener('pointerenter',ev=>{
          tip.innerHTML='<div class="tt">'+j+' · '+e.y+' · '+esc(e.treat)+'</div><div><b>'+esc(e.case)+'</b></div><div>'+esc(e.eff)+'</div>';
          tip.classList.add('show');
          const r=wrapEl.getBoundingClientRect();
          tip.style.left=Math.max(6,Math.min(ev.clientX-r.left+12, r.width-300))+'px';
          tip.style.top=(ev.clientY-r.top+12)+'px';
        });
        hit.addEventListener('pointerleave',()=>tip.classList.remove('show'));
      }
      const arr = inWin.length?inWin:mine.slice(0,1);
      const last = arr[arr.length-1];
      s('text',{x:x(last.y)+10,y:yv(last.f)+4,fill:col,'font-size':11,'font-weight':600,'font-family':'IBM Plex Mono,monospace'},j);
    }
  }

  asofRow.innerHTML = '<label>as-of 查询(服务端解算)</label>';
  const range = el('input'); range.type='range'; range.min=String(minY); range.max=String(hi); range.value=String(hi);
  range.setAttribute('aria-label','as-of year');
  const out = el('span','yr',String(hi));
  asofRow.appendChild(range); asofRow.appendChild(out);

  let timer=null;
  async function refreshStanding(){
    const data = await api('/timeline/'+id+'?as_of='+asOf);
    standing.innerHTML='';
    for(const r of data.standing_rules){
      if(!jActive[r.jurisdiction]) continue;
      const d = el('div','stand'); d.style.borderLeftColor = jColor(r.jurisdiction);
      d.innerHTML = '<div class="jt"><span style="width:8px;height:8px;border-radius:50%;background:'+jColor(r.jurisdiction)+'"></span>'
        + r.jurisdiction+' '+JZH[r.jurisdiction]+' · '+r.since+'</div>'+esc(r.effect)+'<div class="cs">'+esc(r.case)+' · '+esc(r.treatment)+'</div>';
      standing.appendChild(d);
    }
    for(const j of data.jurisdictions_with_no_authority_at_as_of){
      if(!jActive[j]) continue;
      const d = el('div','stand'); d.style.borderLeftColor = jColor(j);
      d.innerHTML = '<div class="jt"><span style="width:8px;height:8px;border-radius:50%;background:'+jColor(j)+'"></span>'+j+' '+JZH[j]+'</div><span class="cs">该时点本法域尚无认定</span>';
      standing.appendChild(d);
    }
  }
  range.addEventListener('input',()=>{
    asOf=+range.value; out.textContent=String(asOf); draw();
    clearTimeout(timer); timer=setTimeout(refreshStanding,140);
  });
  draw(); refreshStanding();
}

async function viewGraph(main){
  main.innerHTML='';
  main.appendChild(el('h1','page','学说共现图谱 <span style="color:var(--ink3);font-size:.55em;font-weight:500">Doctrine co-occurrence</span>'));
  main.appendChild(el('p','lede','节点为学说标签(大小 = 出现篇数),连边为同篇共现(粗细 = 共现次数)。这是语料自己长出来的学说邻接结构——建要件图时哪些学说该连 typed edge,可以从这里读。'));
  const d = await api('/graph?n=46&min=3');
  const box = el('div','card'); box.style.padding='6px';
  const cv = el('canvas'); cv.style.cssText='width:100%;height:560px;display:block';
  box.appendChild(cv); main.appendChild(box);
  const info = el('p','fig-foot','拖动可平移;共 '+d.nodes.length+' 个节点 / '+d.links.length+' 条边(阈值 ≥3 次共现)。');
  main.appendChild(info);

  const dpr = Math.min(devicePixelRatio||1, 2);
  const W = box.clientWidth-12, H = 560;
  cv.width = W*dpr; cv.height = H*dpr;
  const ctx = cv.getContext('2d'); ctx.scale(dpr,dpr);

  const maxC = Math.max(...d.nodes.map(n=>n.count));
  const N = d.nodes.map((n,i)=>({...n, x: W/2 + Math.cos(i/d.nodes.length*6.283)*Math.min(W,H)*0.34,
                                       y: H/2 + Math.sin(i/d.nodes.length*6.283)*Math.min(W,H)*0.34, vx:0, vy:0,
                                       r: 5 + 15*Math.sqrt(n.count/maxC)}));
  const idx = new Map(N.map(n=>[n.topic,n]));
  const L = d.links.map(l=>({s:idx.get(l.source), t:idx.get(l.target), w:l.weight})).filter(l=>l.s&&l.t);
  const maxW = Math.max(...L.map(l=>l.w));
  let ox=0, oy=0, drag=null;

  cv.onpointerdown = e => drag={x:e.clientX,y:e.clientY,ox,oy};
  cv.onpointermove = e => { if(drag){ ox=drag.ox+(e.clientX-drag.x); oy=drag.oy+(e.clientY-drag.y); } };
  window.addEventListener('pointerup',()=>drag=null);

  function step(){
    for(let i=0;i<N.length;i++){
      const a=N[i];
      for(let j=i+1;j<N.length;j++){
        const b=N[j]; let dx=b.x-a.x, dy=b.y-a.y; let d2=dx*dx+dy*dy||1;
        const f = 900/d2; const dd=Math.sqrt(d2);
        a.vx-=dx/dd*f; a.vy-=dy/dd*f; b.vx+=dx/dd*f; b.vy+=dy/dd*f;
      }
      a.vx += (W/2-a.x)*0.0012; a.vy += (H/2-a.y)*0.0012;
    }
    for(const l of L){
      const dx=l.t.x-l.s.x, dy=l.t.y-l.s.y, dd=Math.hypot(dx,dy)||1;
      const f = (dd-110)*0.0016*(0.5+l.w/maxW);
      l.s.vx+=dx/dd*f; l.s.vy+=dy/dd*f; l.t.vx-=dx/dd*f; l.t.vy-=dy/dd*f;
    }
    for(const n of N){ n.vx*=0.86; n.vy*=0.86; n.x+=n.vx; n.y+=n.vy; }
  }
  const css = getComputedStyle(document.documentElement);
  function draw(){
    const ink = css.getPropertyValue('--ink').trim(), ink3=css.getPropertyValue('--ink3').trim();
    const line = css.getPropertyValue('--line').trim(), acc=css.getPropertyValue('--accent').trim();
    ctx.clearRect(0,0,W,H);
    ctx.save(); ctx.translate(ox,oy);
    for(const l of L){
      ctx.strokeStyle=line; ctx.globalAlpha=0.5+0.5*(l.w/maxW); ctx.lineWidth=0.6+2.4*(l.w/maxW);
      ctx.beginPath(); ctx.moveTo(l.s.x,l.s.y); ctx.lineTo(l.t.x,l.t.y); ctx.stroke();
    }
    ctx.globalAlpha=1;
    for(const n of N){
      ctx.fillStyle=acc; ctx.globalAlpha=0.82;
      ctx.beginPath(); ctx.arc(n.x,n.y,n.r,0,6.284); ctx.fill();
      ctx.globalAlpha=1;
      ctx.fillStyle = n.r>10?ink:ink3;
      ctx.font = (n.r>10?'600 12px':'400 10.5px')+' "IBM Plex Sans",sans-serif';
      ctx.textAlign='center';
      ctx.fillText(n.topic, n.x, n.y+n.r+11);
    }
    ctx.restore();
  }
  let frames=0;
  (function loop(){ if(frames++<420) step(); draw(); requestAnimationFrame(loop); })();
}

        const lo=Math.abs(f.weight_low)*100, hi=Math.abs(f.weight_high)*100, neg=f.weight_high<0;
        w = (neg?'−':'')+lo.toFixed(0)+'–'+hi.toFixed(0)+'%';
        bar = '<div class="rng"><div class="rngbar" style="left:'+(lo/30*100).toFixed(0)+'%;width:'+((hi-lo)/30*100).toFixed(0)+'%;background:'+(neg?'var(--warn)':'var(--accent)')+'"></div></div>'
            + '<span class="tierchip" data-t="'+esc(f.tier||'')+'">'+esc(f.tier||'')+'</span>';
      } else {
        w = f.dispositive?'决定性':(f.gate?'门槛':(f.override?'覆盖':'—'));
      }
      h += '<tr><td><strong>'+esc(f.zh)+'</strong><br><span class="tiny">'+esc(f.en)+'</span>'+(f.note?'<br><span class="tiny" style="color:var(--warn)">'+esc(f.note)+'</span>':'')+'</td>'
        + '<td class="n">'+w+' '+bar+'</td>'
        + '<td><span class="tiny">'+esc(f.evidence||'—')+'</span></td>'
        + '<td><div class="tri" data-f="'+esc(f.id)+'">'
        +   '<button data-v="1">有</button><button data-v="0">无</button><button data-v="?" class="on">未知</button></div></td></tr>';
    }
    h+='</tbody></table>'; tw.innerHTML=h; sec.appendChild(tw);
    out.appendChild(sec);
  }
  main.appendChild(out);

  const res = el('section','elem'); res.id='sc_res';
  res.innerHTML = '<h3>评分结果 <span class="tag">live</span></h3><p class="ezh">切换上面的因素,结果与"下一步该找什么证据"实时重算。</p><div id="sc_body"><p class="tiny">选择任一因素以开始。</p></div>';
  main.appendChild(res);

  const cal = el('section','elem');
  cal.appendChild(el('h3',null,'校准队列 Calibration queue <span class="tag">'+cq.total_factors+' 因素</span>'));
  cal.appendChild(el('p','ezh',esc(cq.note)));
  const cwr = el('div','tblwrap');
  let cch='<table><thead><tr><th>诉因</th><th>阶段</th><th>待赋权重</th><th>语料判例数</th></tr></thead><tbody>';
  for(const r of cq.rows) cch+='<tr><td><strong>'+esc(r.zh)+'</strong></td><td>'+esc(r.stage_zh)+'</td><td class="n">'+r.factors_unassigned+' / '+r.factors_total+'</td><td class="n">'+(r.corpus_hits||'—')+'</td></tr>';
  cch+='</tbody></table>'; cwr.innerHTML=cch; cal.appendChild(cwr);
  cal.appendChild(el('p','tiny','校准方法:对已判案件编码因素在场与否及结果,拟合 logistic 回归,系数即经验权重。语料判例数高者最省力。'));
  main.appendChild(cal);

  main.querySelectorAll('.tri').forEach(g=>{
    g.querySelectorAll('button').forEach(b=>{
      b.onclick = () => {
        g.querySelectorAll('button').forEach(x=>x.classList.remove('on'));
        b.classList.add('on');
        const v=b.dataset.v, id=g.dataset.f;
        if(v==='?') delete SF[id]; else SF[id] = v==='1';
        recompute();
      };
    });
  });

  async function recompute(){
    const body = { module:SCMOD, facts:SF };
    const r = await fetch(API+'/score',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
    const d = await r.json();
    const b = $('#sc_body'); b.innerHTML='';
    const head = el('div','card');
    head.innerHTML = '<div class="head"><span class="stt">总体:'+esc(d.overall)+'</span></div>';
    b.appendChild(head);
    for(const st of d.stages){
      const c = el('div','card');
      let h = '<div class="head"><span class="sid">'+esc(st.stage)+'</span><span class="stt">'+esc(st.zh)+'</span></div>';
      if(st.test_type==='balancing' && st.weights==='unassigned'){
        h += '<p class="test"><strong>权重未赋值</strong> — '+esc(st.reason)+'</p>';
        if(st.factors_present.length) h += '<p class="test"><strong>已具备:</strong> '+st.factors_present.map(f=>esc(f.zh)).join(' · ')+'</p>';
        if(st.unresolved.length) h += '<p class="test"><strong>待查:</strong></p><ol class="ev">'+st.unresolved.slice(0,6).map(f=>'<li>'+esc(f.zh)+(f.look_for?' <span class="tiny">找:'+esc(f.look_for)+'</span>':'')+'</li>').join('')+'</ol>';
        h += '<p class="tiny">'+esc(st.caveat)+'</p>';
      } else if(st.test_type==='balancing'){
        const L=(st.score_low+1)/2*100, H=(st.score_high+1)/2*100;
        h += '<p class="test">净分区间 <strong>'+st.score_low+' … '+st.score_high+'</strong> · '+esc(st.band)
          + ' · 证据已解析 '+Math.round(st.evidence_resolved*100)+'%'
          + (st.interval_decides?' <span class="tag ok">区间可定论</span>':' <span class="tag warn">区间跨档</span>')+'</p>'
          + '<div class="rng2"><div class="rngmid" style="left:50%"></div><div class="rngspan" style="left:'+L.toFixed(1)+'%;width:'+Math.max(1.5,H-L).toFixed(1)+'%;background:'+(st.score_high>=0?'var(--accent)':'var(--warn)')+'"></div></div>';
        const fmtf = f => esc(f.zh)+' <span class="tiny">'+(f.range&&f.range[0]!=null?(Math.abs(f.range[0])*100).toFixed(0)+'–'+(Math.abs(f.range[1])*100).toFixed(0)+'%':'')+'</span>';
        if(st.factors_present.length) h += '<p class="test"><strong>支持:</strong> '+st.factors_present.map(fmtf).join(' · ')+'</p>';
        if(st.factors_against.length) h += '<p class="test"><strong>不利:</strong> '+st.factors_against.map(fmtf).join(' · ')+'</p>';
        if(st.next_evidence.length){
          h += '<p class="test"><strong>下一步取证(按最大摆幅排序):</strong></p><ol class="ev">'
            + st.next_evidence.map(f=>'<li>'+esc(f.zh)+' <span class="tiny">摆幅 '+(Math.abs(f.swing[0])*100).toFixed(0)+'–'+(Math.abs(f.swing[1])*100).toFixed(0)+'% · 找:'+esc(f.look_for||'—')+'</span></li>').join('')+'</ol>';
        }
        h += '<p class="tiny">'+esc(st.caveat)+'</p>';
      } else if(st.test_type==='disjunctive-gateway'){
        h += '<p class="test">门槛:<strong>'+esc(st.result)+'</strong> — '+esc(st.note)+'</p>';
        if(st.gateways_open.length) h += '<p class="test"><strong>已开门槛:</strong> '+st.gateways_open.map(g=>esc(g.zh)+(g.dispositive?' <span class="tag ok">决定性</span>':'')).join(' · ')+'</p>';
      } else {
        h += '<p class="test"><strong>'+esc(st.result)+'</strong> — '+esc(st.effect)+'</p>';
      }
      c.innerHTML=h; b.appendChild(c);
    }
    if(d.priority_evidence && d.priority_evidence.length){
      const pe = el('div','card');
      pe.innerHTML = '<div class="head"><span class="stt">全模块取证优先级</span></div><ol class="ev">'
        + d.priority_evidence.map(f=>'<li>'+esc(f.zh)+' <span class="tiny">摆幅 '+(Math.abs(f.swing[0])*100).toFixed(0)+'–'+(Math.abs(f.swing[1])*100).toFixed(0)+'%</span></li>').join('')+'</ol>';
      b.appendChild(pe);
    }
    const cav = el('p','tiny'); cav.textContent = d.stages.find(s=>s.caveat)?.caveat || '';
    b.appendChild(cav);
  }
}

async function route(){
  renderModes(); renderRail();
  const main = $('#main');
  main.innerHTML = '<div class="loading">Loading…</div>';
  try{
    if(state.mode==='doctrine') await viewDoctrine(main);
    else if(state.mode==='corpus'){
      const bar = el('nav','subs');
      for(const [k,label] of SUBS){
        const b = el('button',null,label);
        b.setAttribute('aria-current', String((state.sub||'corpus')===k));
        b.onclick = () => { state.sub=k; route(); };
        bar.appendChild(b);
      }
      main.innerHTML=''; main.appendChild(bar);
      const body = el('div'); main.appendChild(body);
      const sub = state.sub||'corpus';
      if(sub==='cases') await viewCases(body);
      else if(sub==='topics') await viewTopics(body);
      else if(sub==='graph') await viewGraph(body);
      else await viewCorpus(body);
    }
    else if(state.mode==='maint') await viewMaint(main);
    else if(state.mode==='scored') await viewScored(main);
    else await viewApi(main);
  }catch(e){
    main.innerHTML = '<div class="card"><h4>加载失败</h4><p class="test">'+esc(e.message)+'</p></div>';
  }
  renderRail();
}

$('#gq').addEventListener('input', e => {
  state.q = e.target.value;
  if(state.mode!=='corpus'){ state.mode='corpus'; state.filters={}; } state.sub='corpus';
  clearTimeout(window.__gt); window.__gt = setTimeout(route, 260);
});

(async function init(){
  try{
    const [tax, els, stats] = await Promise.all([api('/taxonomy'), api('/elements'), api('/stats')]);
    state.tax=tax; state.elements=els; state.stats=stats;
    $('#apistat').textContent = 'live · '+fmt(stats.posts)+' posts';
    const tiles = el('div','tiles');
    route();
  }catch(e){
    $('#apistat').textContent='error';
    $('#main').innerHTML = '<div class="card"><h4>API 未就绪</h4><p class="test">'+esc(e.message)+'</p></div>';
  }
})();
</script>
</body>
